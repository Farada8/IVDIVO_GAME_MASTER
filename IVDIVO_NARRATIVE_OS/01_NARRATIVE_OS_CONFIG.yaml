system:
  name: IVDIVO_NARRATIVE_OS
  version: "1.3"
  status: CANONICAL_SPECIALIZED_PRODUCTION_SYSTEM
  owner: Yaromyr Farada
  parent_canon: IVDIVO_WRITING_PRODUCTION_CANON.md
  saga_bible: IVDIVO_MASTER_SAGA_BIBLE_v1.0.md
  specialist_bank: IVDIVO_WRITERS_ROOM_50_PROMPTS.md

conversation_bootstrap:
  required_for_book_work: true
  identify_before_work:
    - active_project_or_book_or_line
    - active_branch
    - current_authority
    - current_production_stage
    - last_verified_accepted_frontier
    - last_completed_artifact
    - next_unblocked_obligation
    - last_unfinished_decision
  mandatory_prompt_load:
    - IVDIVO_NARRATIVE_OS/00_NARRATIVE_OS_CANON.md
    - IVDIVO_NARRATIVE_OS/09_UNIVERSAL_BOOK_WORKROOM_BOOT.md
    - IVDIVO_NARRATIVE_OS/12_UNIVERSAL_WORKROOM_CONTINUATION_PROMPT_v1.0.md
    - IVDIVO_NARRATIVE_OS/13_CROSS_DIALOG_MULTI_AI_STATE_OS.md
    - IVDIVO_NARRATIVE_OS/08_100_PERSON_VIRTUAL_PRODUCTION_STUDIO_OPERATING_LAYER.md
    - IVDIVO_NARRATIVE_OS/02_AGENT_PROMPTS_MASTER.md
    - IVDIVO_NARRATIVE_OS/10_BOOK_SPECIFIC_WORKROOM_OVERLAYS.md
  connected_sources_when_relevant:
    - project_conversations
    - github_main
    - google_drive_ivdivo
    - chatgpt_file_library
  unavailable_source_rule: MARK_UNKNOWN_DO_NOT_RECONSTRUCT_CANON_FROM_MEMORY
  continuation_rule: RESTORE_CURRENT_STATE_AND_EXECUTE_NEXT_UNBLOCKED_OBLIGATION
  stale_pointer_rule: AUTHORITY_RULES_FROM_HIGHER_SOURCE_PROGRESS_FROM_NEWEST_VERIFIED_COMPATIBLE_ARTIFACT
  persistence_rule: MATERIAL_PROGRESS_REQUIRES_WRITEBACK_AND_READBACK_VERIFICATION

current_state_resolver:
  required_fields:
    - active_project_or_book
    - active_branch
    - current_authority
    - source_file_version_hash_when_applicable
    - current_mode
    - last_verified_accepted_frontier
    - last_completed_stage_or_artifact
    - next_unblocked_obligation
    - open_fatal
    - open_major
    - founder_decision_required
    - locked_or_forbidden_changes
    - evidence_provenance
  file_existence_is_not_validity: true
  reuse_hash_valid_noninvalidated_artifacts: true
  invalidate_true_descendants_only: true
  do_not_redo_passed_or_locked_stage_without_new_evidence: true

writeback:
  material_progress_requires_persistence: true
  order:
    - result_artifact
    - project_current_state_or_frontier
    - changelog_or_decision_record_if_material
    - google_drive_mirror_where_required
    - readback_verification
  volatile_progress_goes_to_project_state: true
  reusable_law_goes_to_narrative_os: true

multi_ai_handoff:
  external_ai_output_default_status: CANDIDATE_UNVERIFIED
  required_packet_fields:
    - project_or_book_id
    - task_id
    - authority_sources_versions_hashes
    - active_branch_or_build
    - current_stage_frontier
    - exact_input_artifacts
    - immutable_locks
    - allowed_change_scope
    - forbidden_changes
    - relevant_reference_mechanisms
    - required_output_schema_and_filenames
    - acceptance_gates
    - evidence_provenance_requirements
    - exact_next_consumer_stage
  promote_only_after_validation: true
  provider_is_worker_not_authority: true
  human_signal_external_only: true

selective_repair:
  default_sequence: ISSUE_TO_PATCH_QUEUE_TO_PATCH_CONTRACT_TO_TARGETED_REPAIR_TO_LOCAL_QA_TO_COMMIT_TARGET_TO_INVALIDATE_DESCENDANTS_TO_REGRESSION
  whole_book_regeneration_default: false
  stale_patch_contract_aborts: true
  failed_or_no_effect_candidate_cannot_replace_accepted_text: true

priority:
  - founder_instruction
  - approved_canon
  - complete_current_story
  - causality
  - character_truth
  - emotional_impact
  - reader_engagement
  - continuity
  - world_logic
  - genre_promise
  - market
  - franchise
  - prose_polish

statuses:
  material:
    - CANON
    - WORKING
    - OPTION
    - UNKNOWN
    - REFERENCE_ONLY
    - SUPERSEDED
    - REJECTED
  issue:
    - FATAL
    - MAJOR
    - MEDIUM
    - POLISH
  gate:
    - GREEN
    - YELLOW
    - RED
  thread:
    - ACTIVE
    - DORMANT
    - RESOLVED
    - TRANSFORMED
    - ABANDONED_INTENTIONALLY

phases:
  - CONTINUITY_LOAD
  - REFERENCE_MECHANISM_PASS
  - DISCOVER
  - FORM
  - CHARACTER_RELATIONSHIP
  - ENCODE
  - WEAVE
  - GREENLIGHT
  - DRAFT
  - DEVELOPMENT_EDIT
  - ATTACK
  - CHARACTER_RELATIONSHIP_PASS
  - RECEIVE
  - DIALOGUE_PASS
  - LINE_EDIT
  - INTEGRATE
  - FINAL_STORY_GATE
  - EXTERNAL_FEEDBACK
  - LOCK

agents:
  A00:
    name: Router_Showrunner
    phase: all
    calls_modules: [10, 20, 30]
    output: ROUTE_PLAN
  A01:
    name: Story_Discovery
    phase: DISCOVER
    calls_modules: [1, 2, 21, 32, 33]
    output: DISCOVERY_BRIEF
  A02:
    name: Storyform_Architecture
    phase: FORM
    calls_modules: [3, 13, 14, 20, 35, 42]
    output: STORYFORM_REPORT
  A03:
    name: Character_Arc
    phase: FORM
    calls_modules: [4, 12, 43, 44, 45]
    output: CHARACTER_REPORT
  A04:
    name: Relationship
    phase: FORM
    calls_modules: [26, 34, 47]
    output: RELATIONSHIP_REPORT
  A05:
    name: World_Social_Systems
    phase: ENCODE
    calls_modules: [11, 22, 24, 25]
    output: WORLD_SOCIAL_REPORT
  A06:
    name: Science_Technology_Metaphysics
    phase: ENCODE
    calls_modules: [15, 23, 44]
    output: SYSTEMS_REPORT
  A07:
    name: Mystery_Continuity_Memory
    phase: FORM
    calls_modules: [6, 19, 36, 41, 49]
    output: MYSTERY_CONTINUITY_REPORT
  A08:
    name: Storyweaver
    phase: WEAVE
    calls_modules: [7, 32, 34, 35, 36, 37]
    output: CHAPTER_WEAVE
  A09:
    name: Scene_Engine
    phase: WEAVE
    calls_modules: [7, 28, 29]
    output: SCENE_CARDS
  A10:
    name: Dialogue_Voice
    phase: WEAVE
    calls_modules: [5, 27, 38]
    output: DIALOGUE_VOICE_REPORT
  A11:
    name: Youth_Psychology
    phase: ENCODE
    calls_modules: [16, 31]
    output: YOUTH_REALITY_REPORT
  A12:
    name: Action_Horror_Pressure
    phase: WEAVE
    calls_modules: [28, 29, 44]
    output: PRESSURE_REPORT
  A13:
    name: Reader_Reception
    phase: RECEIVE
    calls_modules: [32, 34, 40]
    output: READER_REPORT
  A14:
    name: Market_Genre_Franchise
    phase: RECEIVE
    calls_modules: [17, 18, 42]
    output: MARKET_GENRE_REPORT
  A15:
    name: Primary_Writer
    phase: DRAFT
    calls_modules: [5, 7, 38]
    input_required: WRITER_BRIEF
    output: MANUSCRIPT_PATCH
  A16:
    name: Red_Team
    phase: ATTACK
    calls_modules: [9, 20, 40]
    output: RED_TEAM_REPORT
  A17:
    name: Revision_Surgeon
    phase: REVISE
    calls_modules: [39, 30]
    output: REVISION_PLAN
  A18:
    name: Prose_Line_Editor
    phase: LINE_EDIT
    calls_modules: [5, 27, 38]
    output: LINE_EDIT_REPORT
  A19:
    name: Reconciler_Editor_in_Chief
    phase: INTEGRATE
    calls_modules: [20, 30]
    output: INTEGRATED_DECISION

modes:
  NEW_BOOK:
    default_agents: [A00, A01, A02, A03, A04, A05, A06, A07, A11, A08, A09, A10, A12, A19, A15, A16, A17, A13, A19]
    required_gates: [STORY_CORE, ARCHITECTURE, CHAPTER_MAP, PRE_DRAFT, POST_DRAFT, FINAL_STORY]
  ACTIVE_DRAFT:
    default_agents: [A00, A07, A09, A03, A10, A13, A19, A15, A16, A17]
    required_gates: [SCENE, CHAPTER, REGRESSION]
  LOCKED_BOOK:
    default_agents: [A00, A13, A14]
    rewrite_requires_new_evidence: true
  REFERENCE_RESEARCH:
    default_agents: [A00, A01, A19]
    copy_boundary_required: true
  RED_TEAM:
    default_agents: [A00, A16, A19]
  BOOK_STUDIO:
    default_agents: [A00, A13, A14, A19]
    story_rewrite_default: false
  SAGA_CONTINUITY:
    default_agents: [A00, A07, A18, A19]

profiles:
  LESSON_ZERO:
    book: 1
    status: DEVELOPMENT_LOCKED_EXTERNAL_FEEDBACK
    overlay: B01
    reopen_story_on:
      - founder_instruction
      - convergent_external_feedback
      - continuity_or_factual_error
  ORBITAL_YOUTH:
    book: 2
    status: WORKING
    overlay: B02
    force_agents: [A05, A11]
    force_modules: [16, 22, 31]
    everyday_life_required: true
  SMITH:
    book: 3
    status: WORKING
    overlay: B03
    force_modules: [24, 25, 19]
    early_contact_engine: OLD_EARTH_SECURITY_PLANETARY_AUTHORITIES_ORBITAL_AUTHORITIES_INDIVIDUAL_RIGHTS_LIMITED_CONFEDERATION_KNOWLEDGE
    service_remains_active: true
    enia_synthesis_continues: true
  CROSSING_I:
    book: 4
    status: WORKING_NO_STORY_ENGINE_LOCKED
    overlay: B04
    permanent_team_default: REJECTED
  BOOKS_5_TO_10:
    status: WORKING_OR_UNKNOWN
    overlay_rule: LOAD_ONLY_IF_FOUNDER_OR_COMPLETED_BOOK_CONSEQUENCES_CONFIRM_FUNCTION

reference_policy:
  transformation: REFERENCE_TO_ABSTRACT_MECHANISM_TO_COMBINE_2_3_TO_IVDIVO_ORIGINAL
  source_locations:
    - google_drive_library
    - chatgpt_file_library
    - github_source_registry
    - story_engine
  first_reuse_current_abstraction_stack: true
  fresh_source_pass_when_mechanisms_insufficient_or_new_evidence_material: true
  never_copy:
    - plot
    - distinctive_scene_sequence
    - signature_dialogue
    - unique_character
    - proprietary_terminology
    - signature_invention

stop_rules:
  - do_not_run_all_agents_without_need
  - do_not_rewrite_locked_book_without_new_evidence
  - do_not_expand_franchise_before_current_story_closes
  - do_not_use_market_preference_as_story_defect
  - do_not_line_edit_before_structural_failures_are_resolved
  - do_not_silently_change_canon
  - do_not_copy_reference_expression
  - do_not_start_prose_before_story_gate
  - do_not_restart_completed_stage_without_new_evidence
  - do_not_lock_books_5_to_10_from_present_forecasts
  - do_not_claim_cross_dialog_completion_without_persistence_when_persistence_is_required
  - do_not_promote_external_ai_output_without_validation
  - do_not_promote_recovery_package_from_test_count_alone

continuation_commands:
  - "и"
  - "дальше"
  - "продолжай"
  - "делай"
  - "работай"
  - "RUN THE STUDIO"
  - "WRITERS’ ROOM"
  - "RED TEAM"
  - "BOOK STUDIO"
  - "AUDIO CONTINUE"
