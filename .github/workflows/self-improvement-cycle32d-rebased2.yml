name: self-improvement-cycle32d-rebased2

on:
  pull_request:
    paths:
      - 'tools/ivdivo_preexecution_resume_guard.py'
      - 'tests/test_ivdivo_preexecution_resume_guard.py'
      - 'SELF_IMPROVEMENT_ENGINE/CYCLE32D_REBASED2_2026-08-22/**'
      - '.github/workflows/self-improvement-cycle32d-rebased2.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run rebased2 resume-guard regression
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_ivdivo_preexecution_resume_guard.py
