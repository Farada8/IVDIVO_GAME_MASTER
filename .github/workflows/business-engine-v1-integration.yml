name: Business Engine v1 Integration
on:
  pull_request:
    paths:
      - 'BUSINESS_ENGINEERING_OS/2026-08-22_CYCLE4_BUSINESS_ENGINE_V1_INTEGRATION_REBASE/**'
      - 'BUSINESS_ENGINEERING_OS/LIBRARY/BOOK_ENGINE_SHARED_INFRASTRUCTURE_DEPENDENCY_v07.json'
      - '.github/workflows/business-engine-v1-integration.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run integration regression
        run: |
          cd BUSINESS_ENGINEERING_OS/2026-08-22_CYCLE4_BUSINESS_ENGINE_V1_INTEGRATION_REBASE
          PYTHONPATH=. python -m unittest tests.test_business_engine_integration_v1 -v
          python -m compileall -q engine/business_engine_integration_v1.py
