name: Personal AI PL-14 Knowledge Search

on:
  pull_request:
    paths:
      - 'personal-ai/knowledge/**'
      - 'personal-ai/tests/test_personal_knowledge_search.py'
      - 'personal-ai/run.py'
      - '.github/workflows/personal-ai-pl14-knowledge-search.yml'

jobs:
  pl14-knowledge-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PL-14 acceptance tests
        run: |
          cd personal-ai
          python -m unittest tests/test_personal_knowledge_search.py -v
      - name: Full Personal AI regression suite
        run: |
          cd personal-ai
          python -m unittest discover -s tests -p 'test_*.py'
