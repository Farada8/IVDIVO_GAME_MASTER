name: Business Engineering Cycle4 Design

on:
  pull_request:
    paths:
      - 'BUSINESS_ENGINEERING_OS/2026-08-22_CYCLE4_DESIGN_PUBLIC_ART_HOSPITALITY_32_TO_64/**'
      - '.github/workflows/business-engineering-cycle4.yml'
  push:
    paths:
      - 'BUSINESS_ENGINEERING_OS/2026-08-22_CYCLE4_DESIGN_PUBLIC_ART_HOSPITALITY_32_TO_64/**'
      - '.github/workflows/business-engineering-cycle4.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cycle4 32-test regression
        working-directory: BUSINESS_ENGINEERING_OS/2026-08-22_CYCLE4_DESIGN_PUBLIC_ART_HOSPITALITY_32_TO_64
        run: PYTHONPATH=. python -m unittest discover -s tests -v
