name: Business Three Path Real Evidence

on:
  pull_request:
    paths:
      - 'BUSINESS_ENGINEERING_OS/2026-08-22_THREE_PATH_REAL_EVIDENCE_SPRINT/**'
      - '.github/workflows/business-three-path-real-evidence.yml'
  push:
    branches:
      - 'business-engineering/three-path-real-evidence-sprint-20260822'

jobs:
  three-path-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run three-path canaries
        run: python -m pytest -q BUSINESS_ENGINEERING_OS/2026-08-22_THREE_PATH_REAL_EVIDENCE_SPRINT/tests/test_three_path_gate.py
      - name: Validate JSON state
        run: python -m json.tool BUSINESS_ENGINEERING_OS/2026-08-22_THREE_PATH_REAL_EVIDENCE_SPRINT/01_STATE.json >/dev/null
      - name: Compile runtime
        run: python -m compileall BUSINESS_ENGINEERING_OS/2026-08-22_THREE_PATH_REAL_EVIDENCE_SPRINT/engine/three_path_gate.py
