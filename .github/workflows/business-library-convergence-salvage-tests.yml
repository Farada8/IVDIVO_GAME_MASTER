name: Business Library Convergence Salvage Tests

on:
  pull_request:
    paths:
      - 'BUSINESS_ENGINEERING_OS/2026-08-22_CYCLE5_LIBRARY_MECHANISM_CONVERGENCE_SALVAGE/**'
      - '.github/workflows/business-library-convergence-salvage-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convergence-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run convergence guard canaries
        run: python -m unittest discover -s BUSINESS_ENGINEERING_OS/2026-08-22_CYCLE5_LIBRARY_MECHANISM_CONVERGENCE_SALVAGE/tests -p 'test_*.py' -v
