name: Self-Improvement Integrity

on:
  pull_request:
    paths:
      - '31_IDEAS/**'
      - 'PROJECT_STATES/**'
      - 'tools/ivdivo_self_improvement.py'
      - 'tools/ivdivo_registry_transaction.py'
      - 'tools/validate_improvement_registry_refs.py'
      - 'tools/validate_project_state_coverage.py'
      - 'tests/test_registry_transaction.py'
      - 'tests/test_project_state_coverage.py'
      - 'tests/test_validate_improvement_registry_refs.py'
      - '.github/workflows/self-improvement-integrity.yml'
  push:
    branches: [ main ]
    paths:
      - '31_IDEAS/**'
      - 'PROJECT_STATES/**'
      - 'tools/ivdivo_self_improvement.py'
      - 'tools/ivdivo_registry_transaction.py'
      - 'tools/validate_improvement_registry_refs.py'
      - 'tools/validate_project_state_coverage.py'
      - 'tests/test_registry_transaction.py'
      - 'tests/test_project_state_coverage.py'
      - 'tests/test_validate_improvement_registry_refs.py'

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Validate state-to-registry references
        run: python tools/validate_improvement_registry_refs.py
      - name: Validate portfolio project-state coverage
        run: python tools/validate_project_state_coverage.py
      - name: Audit self-improvement lifecycle registry
        run: python tools/ivdivo_self_improvement.py audit
      - name: Run transaction and coverage regressions
        run: >-
          pytest -q
          tests/test_registry_transaction.py
          tests/test_project_state_coverage.py
          tests/test_validate_improvement_registry_refs.py
