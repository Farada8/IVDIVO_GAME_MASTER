name: ROOM917 Support SFX Synth Canaries

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/room917-support-sfx-synth-canaries.yml'
      - 'AUDIO_PRODUCTION/ROOM917/SOUND_DESIGN/tools/generate_support_sfx_synth_canaries.py'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy scipy soundfile
      - name: Generate 39 support SFX/music canaries
        run: python AUDIO_PRODUCTION/ROOM917/SOUND_DESIGN/tools/generate_support_sfx_synth_canaries.py
      - name: Machine identity/format preflight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,soundfile as sf,numpy as np
          root=Path('ROOM917_SUPPORT_SFX_CANARIES')
          rec=json.loads((root/'ROOM917_E01_SUPPORT_SFX_SYNTHETIC_CANARY_RECEIPT_v1.json').read_text())
          rows=rec['assets']
          if len(rows)!=39: raise SystemExit(f'expected 39 assets, got {len(rows)}')
          for row in rows:
              p=root/row['filename']
              if not p.is_file(): raise SystemExit(f'missing {p}')
              if hashlib.sha256(p.read_bytes()).hexdigest()!=row['sha256']: raise SystemExit(f'hash drift {p}')
              y,sr=sf.read(p,always_2d=True)
              if sr!=48000 or y.shape[1]!=2 or not np.isfinite(y).all(): raise SystemExit(f'format/finite fail {p}')
          print('PASS: 39 hashes + 48k stereo finite PCM decoded. Human audition remains mandatory.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ROOM917_E01_SUPPORT_SFX_SYNTH_CANARIES
          path: ROOM917_SUPPORT_SFX_CANARIES/
          if-no-files-found: error
          retention-days: 30
      - name: Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ROOM917 E01 support SFX canaries
          - 13 functions x 3 variants = 39 WAV candidates
          - S01/S02/S03/S04/S05/S06/S09/S12/S15/S16/S20/S21 + M01
          - S18 breathing intentionally excluded: ElevenLabs/cast performance stream boundary
          - 48 kHz / 24-bit / stereo
          - provider calls: 0; paid synthesis: 0
          - status: CANDIDATE / HOLD
          - production binding forbidden until human audition + translation + identity gates
          EOF
