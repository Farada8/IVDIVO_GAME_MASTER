name: autopilot-preexecution-guard-canon

on:
  pull_request:
    paths:
      - 'IVDIVO_NARRATIVE_OS/13_CROSS_CONVERSATION_STATE_AND_AUTOPILOT.md'
      - 'IVDIVO_NARRATIVE_OS/13A_PRE_EXECUTION_RESUME_GUARD_CANONICAL_AMENDMENT_v1.0.md'
      - 'tools/ivdivo_preexecution_resume_guard.py'
      - 'tests/test_autopilot_preexecution_guard_contract.py'
      - '.github/workflows/autopilot-preexecution-guard-canon.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-guard-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify canonical guard binding
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_autopilot_preexecution_guard_contract.py tests/test_ivdivo_preexecution_resume_guard.py
