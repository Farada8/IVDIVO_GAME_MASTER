name: ROOM917 RU Voice Discovery

# v1.3 public native/durable zero-spend discovery 2026-08-22
on:
  push:
    paths:
      - '.github/workflows/room917-ru-voice-discovery.yml'
      - 'AUDIO_PRODUCTION/ROOM917/RU_PILOT/tools/discover_ru_voice_candidates.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Discover durable native-Russian professional shared voices
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider
          python AUDIO_PRODUCTION/ROOM917/RU_PILOT/tools/discover_ru_voice_candidates.py \
            --out AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider/RU_NATIVE_VOICE_DISCOVERY.json \
            --min-notice-days 365 \
            --page-size 100 \
            --max-pages 3

      - name: Acquire account voice and model inventory when secret exists
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider
          if [ -z "${ELEVENLABS_API_KEY:-}" ]; then
            python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          out={
              'schema_version':'ivdivo.room917_ru_account_voice_inventory/1.1',
              'generated_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'provider':'ElevenLabs',
              'status':'SKIPPED_NO_REPOSITORY_SECRET',
              'secret_persisted':False,
              'paid_synthesis_calls':0,
              'voice_count':None,
              'voices':[],
              'models':[],
              'ranked_role_candidates':{},
              'note':'Native shared-voice discovery is independent and still runs because /v1/shared-voices documents xi-api-key as optional.'
          }
          Path('AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider/RU_VOICE_DISCOVERY.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+'\n', encoding='utf-8')
          PY
            exit 0
          fi

          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          KEY=os.environ['ELEVENLABS_API_KEY']
          HEAD={'xi-api-key':KEY, 'Accept':'application/json'}

          def get_json(url):
              req=urllib.request.Request(url, headers=HEAD)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read().decode('utf-8'))

          voices=[]
          token=None
          while True:
              q={'page_size':100, 'include_total_count':'false', 'sort':'name', 'sort_direction':'asc'}
              if token:
                  q['next_page_token']=token
              data=get_json('https://api.elevenlabs.io/v2/voices?'+urllib.parse.urlencode(q))
              for v in data.get('voices',[]):
                  labels=v.get('labels') or {}
                  voices.append({
                      'voice_id':v.get('voice_id'),
                      'name':v.get('name'),
                      'category':v.get('category'),
                      'description':v.get('description'),
                      'labels':labels,
                  })
              if not data.get('has_more'):
                  break
              token=data.get('next_page_token')
              if not token:
                  break

          models=get_json('https://api.elevenlabs.io/v1/models')
          model_rows=[]
          for m in models:
              langs=[x.get('language_id') for x in (m.get('languages') or []) if x.get('language_id')]
              model_rows.append({
                  'model_id':m.get('model_id'),
                  'name':m.get('name'),
                  'can_do_text_to_speech':m.get('can_do_text_to_speech'),
                  'maximum_text_length_per_request':m.get('maximum_text_length_per_request'),
                  'languages':langs,
              })

          def text(v):
              return ' '.join([
                  str(v.get('name') or ''), str(v.get('category') or ''), str(v.get('description') or ''),
                  ' '.join(f'{k}:{val}' for k,val in (v.get('labels') or {}).items())
              ]).lower()

          def score(v, role):
              t=text(v)
              s=0
              gender=(v.get('labels') or {}).get('gender','').lower()
              if role in ('ELENA','MINA','CATE') and 'female' in gender: s += 8
              if role=='JULIAN' and 'male' in gender: s += 8
              if role=='ELENA':
                  for kw,w in [('calm',4),('grounded',5),('professional',4),('conversational',4),('narration',-2),('young',2),('middle-aged',1)]:
                      if kw in t:s+=w
              elif role=='JULIAN':
                  for kw,w in [('calm',4),('professional',4),('confident',3),('authoritative',2),('conversational',3),('deep',1),('young',2),('middle-aged',1)]:
                      if kw in t:s+=w
              elif role=='MINA':
                  for kw,w in [('conversational',5),('warm',4),('friendly',3),('energetic',2),('young',2),('middle-aged',1),('expressive',2)]:
                      if kw in t:s+=w
              elif role=='CATE':
                  for kw,w in [('warm',5),('calm',3),('conversational',4),('gentle',4),('middle-aged',2),('young',1),('narration',-2)]:
                      if kw in t:s+=w
              if any(x in t for x in ['russian','slavic','eastern european']): s += 3
              return s

          ranked={}
          for role in ['ELENA','JULIAN','MINA','CATE']:
              rows=sorted(voices, key=lambda v:(score(v,role), (v.get('name') or '').lower()), reverse=True)
              ranked[role]=[
                  {'voice_id':v['voice_id'],'name':v['name'],'score':score(v,role),'category':v.get('category'),'description':v.get('description'),'labels':v.get('labels')}
                  for v in rows[:12]
              ]

          out={
              'schema_version':'ivdivo.room917_ru_account_voice_inventory/1.1',
              'generated_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'provider':'ElevenLabs',
              'status':'PASS_AUTHENTICATED_ACCOUNT_INVENTORY',
              'secret_persisted':False,
              'paid_synthesis_calls':0,
              'voice_count':len(voices),
              'voices':voices,
              'models':model_rows,
              'ranked_role_candidates':ranked,
              'warning':'Account metadata ranking is pre-audition only. Native RU shared-voice discovery is the production casting frontier.'
          }
          Path('AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider/RU_VOICE_DISCOVERY.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+'\n', encoding='utf-8')
          print(f"account voices={len(voices)} models={len(model_rows)}")
          PY

      - name: Validate discovery artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          native=Path('AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider/RU_NATIVE_VOICE_DISCOVERY.json')
          account=Path('AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider/RU_VOICE_DISCOVERY.json')
          if not native.exists():
              raise SystemExit('native discovery artifact missing')
          if not account.exists():
              raise SystemExit('account inventory artifact missing')
          n=json.loads(native.read_text(encoding='utf-8'))
          a=json.loads(account.read_text(encoding='utf-8'))
          if n.get('paid_synthesis_calls') != 0:
              raise SystemExit('native discovery unexpectedly reports paid synthesis')
          if n.get('selection_policy',{}).get('auto_cast') is not False:
              raise SystemExit('native discovery must not auto-cast')
          print(f"native_status={n.get('status')} candidates={n.get('candidate_count')} account_status={a.get('status')}")
          PY

      - name: Commit provider inventory if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider/RU_VOICE_DISCOVERY.json \
            AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider/RU_NATIVE_VOICE_DISCOVERY.json
          if git diff --cached --quiet; then
            echo 'No inventory change.'
            exit 0
          fi
          git commit -m 'ROOM917: refresh RU ElevenLabs voice inventory [skip ci]'
          git push

      - name: Summary
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          a=json.loads(Path('AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider/RU_VOICE_DISCOVERY.json').read_text(encoding='utf-8'))
          n=json.loads(Path('AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider/RU_NATIVE_VOICE_DISCOVERY.json').read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('## ROOM917 RU voice discovery\n')
              f.write(f"- native discovery status: {n.get('status')}\n")
              f.write(f"- native RU professional voices (>=365-day notice): {n.get('candidate_count')}\n")
              f.write(f"- account inventory status: {a.get('status')}\n")
              f.write(f"- account voices available: {a.get('voice_count')}\n")
              f.write(f"- models returned: {len(a.get('models') or [])}\n")
              f.write('- paid synthesis calls: 0\n')
              f.write('- provider key persisted: false\n')
              f.write('- next: preview native role-ranked candidates, bind 3 per role, then bounded Russian canary + pair tests\n')
          PY
