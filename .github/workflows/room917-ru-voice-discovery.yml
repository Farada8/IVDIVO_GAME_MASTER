name: ROOM917 RU Voice Discovery

# v1.5 zero-spend retrigger 2026-08-22; public native discovery; concurrency-safe main publication
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/room917-ru-voice-discovery.yml'
      - 'AUDIO_PRODUCTION/ROOM917/RU_PILOT/tools/discover_ru_voice_candidates.py'
      - 'AUDIO_PRODUCTION/ROOM917/RU_PILOT/tools/discover_ru_account_inventory.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: room917-ru-voice-discovery-main
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Discover durable native-Russian professional shared voices
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider
          python AUDIO_PRODUCTION/ROOM917/RU_PILOT/tools/discover_ru_voice_candidates.py \
            --out AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider/RU_NATIVE_VOICE_DISCOVERY.json \
            --min-notice-days 365 \
            --page-size 100 \
            --max-pages 3

      - name: Acquire optional account voice and model inventory
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python AUDIO_PRODUCTION/ROOM917/RU_PILOT/tools/discover_ru_account_inventory.py \
            --out AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider/RU_VOICE_DISCOVERY.json

      - name: Validate discovery artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          native=Path('AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider/RU_NATIVE_VOICE_DISCOVERY.json')
          account=Path('AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider/RU_VOICE_DISCOVERY.json')
          if not native.exists():
              raise SystemExit('native discovery artifact missing')
          if not account.exists():
              raise SystemExit('account inventory artifact missing')
          n=json.loads(native.read_text(encoding='utf-8'))
          a=json.loads(account.read_text(encoding='utf-8'))
          if n.get('paid_synthesis_calls') != 0:
              raise SystemExit('native discovery unexpectedly reports paid synthesis')
          if a.get('paid_synthesis_calls') != 0:
              raise SystemExit('account inventory unexpectedly reports paid synthesis')
          if n.get('selection_policy',{}).get('auto_cast') is not False:
              raise SystemExit('native discovery must not auto-cast')
          required={'ELENA','JULIAN','MINA','CATE'}
          if set((n.get('ranked_role_candidates') or {}).keys()) != required:
              raise SystemExit('native discovery role rankings incomplete')
          print(f"native_status={n.get('status')} candidates={n.get('candidate_count')} account_status={a.get('status')}")
          PY

      - name: Commit and publish provider inventory safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider/RU_VOICE_DISCOVERY.json \
            AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider/RU_NATIVE_VOICE_DISCOVERY.json
          if git diff --cached --quiet; then
            echo 'No inventory change.'
            exit 0
          fi
          git commit -m 'ROOM917: refresh RU ElevenLabs voice inventory [skip ci]'

          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Discovery built on ${GITHUB_REF}; publication to main intentionally skipped."
            exit 0
          fi

          for attempt in 1 2 3 4; do
            echo "Publish attempt ${attempt}/4"
            if git push origin HEAD:main; then
              echo 'Provider snapshot published to main.'
              exit 0
            fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo '::error::Provider snapshot rebase conflict; refusing to overwrite concurrent main work.'
              exit 7
            fi
          done
          echo '::error::Provider snapshot could not be published after 4 non-fast-forward retries.'
          exit 8

      - name: Summary
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          a=json.loads(Path('AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider/RU_VOICE_DISCOVERY.json').read_text(encoding='utf-8'))
          n=json.loads(Path('AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider/RU_NATIVE_VOICE_DISCOVERY.json').read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('## ROOM917 RU voice discovery\n')
              f.write(f"- native discovery status: {n.get('status')}\n")
              f.write(f"- native RU professional voices (>=365-day notice): {n.get('candidate_count')}\n")
              f.write(f"- account inventory status: {a.get('status')}\n")
              f.write(f"- account voices available: {a.get('voice_count')}\n")
              f.write(f"- models returned: {len(a.get('models') or [])}\n")
              f.write('- paid synthesis calls: 0\n')
              f.write('- provider key persisted: false\n')
              f.write('- publication: concurrency-safe fetch/rebase/retry; never force-push\n')
              f.write('- next: preview native role-ranked candidates, bind 3 per role, then bounded Russian canary + pair tests\n')
          PY
