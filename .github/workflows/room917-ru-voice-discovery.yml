name: ROOM917 RU Voice Discovery

# v1.8 zero-spend auth-aware discovery; durable artifact + evidence branch before optional main publication
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/room917-ru-voice-discovery.yml'
      - 'AUDIO_PRODUCTION/ROOM917/RU_PILOT/tools/discover_ru_voice_candidates.py'
      - 'AUDIO_PRODUCTION/ROOM917/RU_PILOT/tools/discover_ru_account_inventory.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: room917-ru-voice-discovery-main
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build native-Russian provider snapshot or HOLD receipt
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider
          python AUDIO_PRODUCTION/ROOM917/RU_PILOT/tools/discover_ru_voice_candidates.py \
            --out AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider/RU_NATIVE_VOICE_DISCOVERY.json \
            --min-notice-days 365 \
            --page-size 100 \
            --max-pages 3

      - name: Acquire optional account voice and model inventory
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python AUDIO_PRODUCTION/ROOM917/RU_PILOT/tools/discover_ru_account_inventory.py \
            --out AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider/RU_VOICE_DISCOVERY.json

      - name: Validate discovery artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          native=Path('AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider/RU_NATIVE_VOICE_DISCOVERY.json')
          account=Path('AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider/RU_VOICE_DISCOVERY.json')
          if not native.exists():
              raise SystemExit('native discovery artifact missing')
          if not account.exists():
              raise SystemExit('account inventory artifact missing')
          n=json.loads(native.read_text(encoding='utf-8'))
          a=json.loads(account.read_text(encoding='utf-8'))
          if n.get('paid_synthesis_calls') != 0:
              raise SystemExit('native discovery unexpectedly reports paid synthesis')
          if a.get('paid_synthesis_calls') != 0:
              raise SystemExit('account inventory unexpectedly reports paid synthesis')
          if n.get('selection_policy',{}).get('auto_cast') is not False:
              raise SystemExit('native discovery must not auto-cast')

          required={'ELENA','JULIAN','MINA','CATE'}
          if set((n.get('ranked_role_candidates') or {}).keys()) != required:
              raise SystemExit('native discovery role rankings incomplete')

          status=n.get('status')
          if status not in {'PASS_CANDIDATES_FOUND','HOLD_NO_NATIVE_DURABLE_CANDIDATES','HOLD_PROVIDER_AUTH_REQUIRED'}:
              raise SystemExit(f'unexpected native discovery status: {status}')

          if status == 'HOLD_PROVIDER_AUTH_REQUIRED':
              if n.get('candidate_count') != 0 or n.get('candidates'):
                  raise SystemExit('auth HOLD must contain zero candidates')
              if n.get('selection_policy',{}).get('full_e01_render_allowed') is not False:
                  raise SystemExit('auth HOLD must explicitly block full E01')

          print(f"native_status={status} candidates={n.get('candidate_count')} account_status={a.get('status')}")
          PY

      - name: Upload recoverable zero-spend discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: ROOM917_RU_NATIVE_VOICE_DISCOVERY
          path: |
            AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider/RU_NATIVE_VOICE_DISCOVERY.json
            AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider/RU_VOICE_DISCOVERY.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit provider inventory locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider/RU_VOICE_DISCOVERY.json \
            AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider/RU_NATIVE_VOICE_DISCOVERY.json
          if git diff --cached --quiet; then
            echo 'No inventory change.'
            echo 'ROOM917_PROVIDER_LOCAL_COMMIT=0' >> "$GITHUB_ENV"
            exit 0
          fi
          git commit -m 'ROOM917: refresh RU ElevenLabs voice inventory [skip ci]'
          echo 'ROOM917_PROVIDER_LOCAL_COMMIT=1' >> "$GITHUB_ENV"

      - name: Publish deterministic evidence branch
        if: env.ROOM917_PROVIDER_LOCAL_COMMIT == '1'
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          evidence_branch="room917-ru-provider-${short_sha}"
          echo "ROOM917_PROVIDER_EVIDENCE_BRANCH=${evidence_branch}" >> "$GITHUB_ENV"
          git push origin "HEAD:refs/heads/${evidence_branch}"
          echo "Provider snapshot published to evidence branch ${evidence_branch}."

      - name: Publish provider inventory to main when permitted
        if: env.ROOM917_PROVIDER_LOCAL_COMMIT == '1'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Discovery built on ${GITHUB_REF}; publication to main intentionally skipped."
            exit 0
          fi

          for attempt in 1 2 3 4; do
            echo "Publish attempt ${attempt}/4"
            if git push origin HEAD:main; then
              echo 'Provider snapshot published to main.'
              exit 0
            fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo '::warning::Provider snapshot rebase conflict; evidence branch remains authoritative for this run.'
              exit 0
            fi
          done
          echo '::warning::Provider snapshot could not be published to main; evidence branch remains recoverable.'
          exit 0

      - name: Summary
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          a=json.loads(Path('AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider/RU_VOICE_DISCOVERY.json').read_text(encoding='utf-8'))
          n=json.loads(Path('AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider/RU_NATIVE_VOICE_DISCOVERY.json').read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('## ROOM917 RU voice discovery\n')
              f.write(f"- native discovery status: {n.get('status')}\n")
              f.write(f"- native RU professional candidates: {n.get('candidate_count')}\n")
              f.write(f"- account inventory status: {a.get('status')}\n")
              f.write(f"- account voices available: {a.get('voice_count')}\n")
              f.write(f"- models returned: {len(a.get('models') or [])}\n")
              f.write('- paid synthesis calls: 0\n')
              f.write('- provider key persisted: false\n')
              f.write(f"- recoverable evidence branch: {os.environ.get('ROOM917_PROVIDER_EVIDENCE_BRANCH','NO_NEW_COMMIT')}\n")
              f.write('- missing provider auth produces HOLD_PROVIDER_AUTH_REQUIRED, never a fake shortlist\n')
              f.write('- paid S0 and full E01 remain blocked until authenticated snapshot + preview evidence + approved bindings\n')
          PY
