name: ROOM917 RU Voice Discovery

# v1.1 no-spend refresh trigger 2026-08-22
on:
  push:
    paths:
      - '.github/workflows/room917-ru-voice-discovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fail closed if ElevenLabs secret missing
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ELEVENLABS_API_KEY:-}" ]; then
            echo "::error::Repository secret ELEVENLABS_API_KEY is not configured."
            exit 2
          fi

      - name: Acquire secret-free voice and model inventory
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          KEY=os.environ['ELEVENLABS_API_KEY']
          HEAD={'xi-api-key':KEY, 'Accept':'application/json'}

          def get_json(url):
              req=urllib.request.Request(url, headers=HEAD)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read().decode('utf-8'))

          voices=[]
          token=None
          while True:
              q={'page_size':100, 'include_total_count':'false', 'sort':'name', 'sort_direction':'asc'}
              if token:
                  q['next_page_token']=token
              data=get_json('https://api.elevenlabs.io/v2/voices?'+urllib.parse.urlencode(q))
              for v in data.get('voices',[]):
                  labels=v.get('labels') or {}
                  voices.append({
                      'voice_id': v.get('voice_id'),
                      'name': v.get('name'),
                      'category': v.get('category'),
                      'description': v.get('description'),
                      'labels': labels,
                  })
              if not data.get('has_more'):
                  break
              token=data.get('next_page_token')
              if not token:
                  break

          models=get_json('https://api.elevenlabs.io/v1/models')
          model_rows=[]
          for m in models:
              langs=[x.get('language_id') for x in (m.get('languages') or []) if x.get('language_id')]
              model_rows.append({
                  'model_id':m.get('model_id'),
                  'name':m.get('name'),
                  'can_do_text_to_speech':m.get('can_do_text_to_speech'),
                  'maximum_text_length_per_request':m.get('maximum_text_length_per_request'),
                  'languages':langs,
              })

          def text(v):
              return ' '.join([
                  str(v.get('name') or ''), str(v.get('category') or ''), str(v.get('description') or ''),
                  ' '.join(f'{k}:{val}' for k,val in (v.get('labels') or {}).items())
              ]).lower()

          def score(v, role):
              t=text(v)
              s=0
              gender=(v.get('labels') or {}).get('gender','').lower()
              if role in ('ELENA','MINA','CATE') and 'female' in gender: s += 8
              if role=='JULIAN' and 'male' in gender: s += 8
              if role=='ELENA':
                  for kw,w in [('calm',4),('grounded',5),('professional',4),('conversational',4),('narration',-2),('young',2),('middle-aged',1)]:
                      if kw in t:s+=w
              elif role=='JULIAN':
                  for kw,w in [('calm',4),('professional',4),('confident',3),('authoritative',2),('conversational',3),('deep',1),('young',2),('middle-aged',1)]:
                      if kw in t:s+=w
              elif role=='MINA':
                  for kw,w in [('conversational',5),('warm',4),('friendly',3),('energetic',2),('young',2),('middle-aged',1),('expressive',2)]:
                      if kw in t:s+=w
              elif role=='CATE':
                  for kw,w in [('warm',5),('calm',3),('conversational',4),('gentle',4),('middle-aged',2),('young',1),('narration',-2)]:
                      if kw in t:s+=w
              if any(x in t for x in ['russian','slavic','eastern european']): s += 3
              return s

          ranked={}
          for role in ['ELENA','JULIAN','MINA','CATE']:
              rows=sorted(voices, key=lambda v:(score(v,role), (v.get('name') or '').lower()), reverse=True)
              ranked[role]=[
                  {'voice_id':v['voice_id'],'name':v['name'],'score':score(v,role),'category':v.get('category'),'description':v.get('description'),'labels':v.get('labels')}
                  for v in rows[:12]
              ]

          out={
              'schema_version':'ivdivo.room917_ru_voice_discovery/1.0',
              'generated_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'provider':'ElevenLabs',
              'secret_persisted':False,
              'paid_synthesis_calls':0,
              'voice_count':len(voices),
              'voices':voices,
              'models':model_rows,
              'ranked_role_candidates':ranked,
              'warning':'Metadata ranking is pre-audition only. No voice is locked until Russian canary and pair tests are heard.'
          }
          Path('AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider/RU_VOICE_DISCOVERY.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+'\n', encoding='utf-8')
          print(f"voices={len(voices)} models={len(model_rows)}")
          PY

      - name: Commit provider inventory if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider/RU_VOICE_DISCOVERY.json
          if git diff --cached --quiet; then
            echo 'No inventory change.'
            exit 0
          fi
          git commit -m 'ROOM917: refresh RU ElevenLabs voice inventory [skip ci]'
          git push

      - name: Summary
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider/RU_VOICE_DISCOVERY.json')
          row=json.loads(p.read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('## ROOM917 RU voice discovery\n')
              f.write(f"- voices available: {row['voice_count']}\n")
              f.write(f"- models returned: {len(row['models'])}\n")
              f.write('- paid synthesis calls: 0\n')
              f.write('- provider key persisted: false\n')
              f.write('- next: audition top candidates in Russian\n')
          PY
