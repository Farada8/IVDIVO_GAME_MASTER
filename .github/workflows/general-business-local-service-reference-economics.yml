name: General Business Local Service Reference Economics

on:
  pull_request:
    paths:
      - 'BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/28_LOCAL_SERVICE_REFERENCE_ECONOMICS.md'
      - 'BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/29_LOCAL_SERVICE_REFERENCE_ECONOMICS_STATE.json'
      - 'BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/runtime/local_service_reference_economics.py'
      - 'BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/tests/test_local_service_reference_economics.py'
      - '.github/workflows/general-business-local-service-reference-economics.yml'
  workflow_dispatch:

jobs:
  local-service-reference-economics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run 12 reference-economics canaries
        run: python -m pytest -q BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/tests/test_local_service_reference_economics.py
      - name: Verify fail-closed evidence state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/29_LOCAL_SERVICE_REFERENCE_ECONOMICS_STATE.json')
          s=json.loads(p.read_text())
          assert s['status']=='REFERENCE_ONLY_HOLD'
          assert s['evidence']['verified_scope_equivalent_subcontract_quotes']==0
          assert s['evidence']['direct_delivery_cost_sheet_verified'] is False
          assert s['evidence']['observed_close_rate'] is None
          assert s['evidence']['observed_acquisition_cost'] is None
          assert s['evidence']['max_affordable_acquisition_cost'] is None
          assert s['evidence']['profitable_route_proven'] is False
          assert s['evidence']['outreach']==0
          assert s['evidence']['spend']==0
          assert s['evidence']['jobs']==0
          assert s['evidence']['wtp'] is None
          print('Local service fail-closed evidence state: PASS')
          PY
