name: ROOM917 RU Render Request Gate

on:
  pull_request:
    paths:
      - '.github/workflows/room917-ru-render-request-gate.yml'
      - 'AUDIO_PRODUCTION/ROOM917/RU_PILOT/ROOM917_RU_PRONUNCIATION_CONTRACT_v1.0.json'
      - 'AUDIO_PRODUCTION/ROOM917/RU_PILOT/ROOM917_RU_V3_PERFORMANCE_TAG_POLICY_v1.0.json'
      - 'AUDIO_PRODUCTION/ROOM917/RU_PILOT/ROOM917_RU_TAKE_RERENDER_REGISTRY_TEMPLATE_v1.0.json'
      - 'AUDIO_PRODUCTION/ROOM917/RU_PILOT/ROOM917_RU_RENDER_REQUEST_BUNDLE_TEMPLATE_v1.0.json'
      - 'AUDIO_PRODUCTION/ROOM917/RU_PILOT/tools/validate_ru_render_requests.py'
      - 'AUDIO_PRODUCTION/ROOM917/RU_PILOT/tests/test_validate_ru_render_requests.py'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/room917-ru-render-request-gate.yml'
      - 'AUDIO_PRODUCTION/ROOM917/RU_PILOT/ROOM917_RU_PRONUNCIATION_CONTRACT_v1.0.json'
      - 'AUDIO_PRODUCTION/ROOM917/RU_PILOT/ROOM917_RU_V3_PERFORMANCE_TAG_POLICY_v1.0.json'
      - 'AUDIO_PRODUCTION/ROOM917/RU_PILOT/ROOM917_RU_TAKE_RERENDER_REGISTRY_TEMPLATE_v1.0.json'
      - 'AUDIO_PRODUCTION/ROOM917/RU_PILOT/ROOM917_RU_RENDER_REQUEST_BUNDLE_TEMPLATE_v1.0.json'
      - 'AUDIO_PRODUCTION/ROOM917/RU_PILOT/tools/validate_ru_render_requests.py'
      - 'AUDIO_PRODUCTION/ROOM917/RU_PILOT/tests/test_validate_ru_render_requests.py'

permissions:
  contents: read

jobs:
  validate-zero-spend-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest AUDIO_PRODUCTION/ROOM917/RU_PILOT/tests/test_validate_ru_render_requests.py -v

      - name: Validate contract invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path('AUDIO_PRODUCTION/ROOM917/RU_PILOT')
          pron=json.loads((root/'ROOM917_RU_PRONUNCIATION_CONTRACT_v1.0.json').read_text(encoding='utf-8'))
          tags=json.loads((root/'ROOM917_RU_V3_PERFORMANCE_TAG_POLICY_v1.0.json').read_text(encoding='utf-8'))
          reg=json.loads((root/'ROOM917_RU_TAKE_RERENDER_REGISTRY_TEMPLATE_v1.0.json').read_text(encoding='utf-8'))
          bundle=json.loads((root/'ROOM917_RU_RENDER_REQUEST_BUNDLE_TEMPLATE_v1.0.json').read_text(encoding='utf-8'))

          if pron.get('story_or_dialogue_change') is not False:
              raise SystemExit('pronunciation contract must not change dialogue')
          if tags.get('story_or_dialogue_change') is not False:
              raise SystemExit('tag policy must not change dialogue')
          if reg.get('whole_episode_rerender') != 'FORBIDDEN':
              raise SystemExit('whole episode rerender must stay forbidden')
          if bundle.get('provider_calls') != 0 or bundle.get('paid_synthesis_calls') != 0:
              raise SystemExit('bundle template must be zero-spend')
          if pron.get('dictionary_build_policy',{}).get('dictionary_locator_count_limit') != 3:
              raise SystemExit('dictionary locator limit must be 3')
          if tags.get('pause_policy',{}).get('ssml_break') != 'FORBIDDEN_IN_ELEVEN_V3':
              raise SystemExit('v3 SSML break policy drift')
          if pron.get('locked_terms',[{}])[2].get('semantic_translation_forbidden') is not True:
              raise SystemExit('Leni-bird semantic translation protection missing')
          print('ROOM917 RU zero-spend voice contracts: PASS')
          PY

      - name: Build and validate one exact CI request from authoritative manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _room917_ru_render_gate
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          m=Path('AUDIO_PRODUCTION/ROOM917/RU_PILOT/ROOM917_RU_E01_E02_ELEVENLABS_V3_MANIFEST_v1.0.json')
          manifest=json.loads(m.read_text(encoding='utf-8'))
          unit=manifest['audition_units'][0]
          text=unit['text']
          h=lambda s: hashlib.sha256(s.encode('utf-8')).hexdigest()
          bundle={'requests':[{
              'request_id':'CI_ZERO_SPEND_U1',
              'unit_id':unit['id'],
              'character':unit['character'],
              'voice_id':'CI_DUMMY_NOT_PROVIDER_CALLED',
              'model_id':'eleven_v3',
              'language_code':'ru',
              'source_text_sha256':h(text),
              'text':text,
              'request_text_sha256':h(text),
              'text_variant_mode':'EXACT_PLUS_TAGS',
              'performance_tags':[],
              'pronunciation_dictionary_locators':[]
          }]}
          Path('_room917_ru_render_gate/CI_REQUEST.json').write_text(json.dumps(bundle,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          python AUDIO_PRODUCTION/ROOM917/RU_PILOT/tools/validate_ru_render_requests.py \
            --manifest AUDIO_PRODUCTION/ROOM917/RU_PILOT/ROOM917_RU_E01_E02_ELEVENLABS_V3_MANIFEST_v1.0.json \
            --tag-policy AUDIO_PRODUCTION/ROOM917/RU_PILOT/ROOM917_RU_V3_PERFORMANCE_TAG_POLICY_v1.0.json \
            --bundle _room917_ru_render_gate/CI_REQUEST.json \
            --report _room917_ru_render_gate/CI_REPORT.json

      - name: Upload zero-spend validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: ROOM917_RU_RENDER_REQUEST_GATE
          path: _room917_ru_render_gate/
          if-no-files-found: error
          retention-days: 14
