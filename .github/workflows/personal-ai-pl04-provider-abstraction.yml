name: Personal AI PL-04 Provider Abstraction

on:
  pull_request:
    paths:
      - 'personal-ai/**'
      - '.github/workflows/personal-ai-pl04-provider-abstraction.yml'

jobs:
  pl04-provider-abstraction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile provider layer
        run: python -m compileall -q personal-ai/providers
      - name: Run PL-04 provider contract tests
        run: python -m unittest personal-ai/tests/test_provider_abstraction.py -v
      - name: Run full Personal AI regression suite
        run: python -m unittest discover -s personal-ai/tests -v
