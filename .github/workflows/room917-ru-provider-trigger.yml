name: ROOM917 RU Provider Trigger

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'AUDIO_PRODUCTION/ROOM917/RU_PILOT/TRIGGER_PROVIDER_DISCOVERY.txt'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fail closed if secret missing
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ELEVENLABS_API_KEY:-}" || { echo '::error::ELEVENLABS_API_KEY secret missing'; exit 2; }

      - name: Read current ElevenLabs account inventory
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          key=os.environ['ELEVENLABS_API_KEY']
          headers={'xi-api-key':key,'Accept':'application/json'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.loads(r.read().decode())

          voices=[]; token=None
          while True:
              q={'page_size':100,'include_total_count':'false','sort':'name','sort_direction':'asc'}
              if token: q['next_page_token']=token
              d=get('https://api.elevenlabs.io/v2/voices?'+urllib.parse.urlencode(q))
              for v in d.get('voices',[]):
                  voices.append({
                      'voice_id':v.get('voice_id'),
                      'name':v.get('name'),
                      'category':v.get('category'),
                      'description':v.get('description'),
                      'labels':v.get('labels') or {}
                  })
              if not d.get('has_more'): break
              token=d.get('next_page_token')
              if not token: break

          models=get('https://api.elevenlabs.io/v1/models')
          models=[{
              'model_id':m.get('model_id'),
              'name':m.get('name'),
              'can_do_text_to_speech':m.get('can_do_text_to_speech'),
              'languages':[x.get('language_id') for x in (m.get('languages') or []) if x.get('language_id')]
          } for m in models]

          out={
              'schema_version':'ivdivo.room917_ru_provider_inventory/1.0',
              'generated_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'provider':'ElevenLabs',
              'secret_persisted':False,
              'paid_synthesis_calls':0,
              'voice_count':len(voices),
              'voices':voices,
              'models':models
          }
          Path('AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider/RU_PROVIDER_INVENTORY.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(f"voices={len(voices)} models={len(models)}")
          PY

      - name: Commit secret-free inventory to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider/RU_PROVIDER_INVENTORY.json
          if git diff --cached --quiet; then
            echo 'No inventory change.'
          else
            git commit -m 'ROOM917: provider inventory for RU casting [skip ci]'
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
