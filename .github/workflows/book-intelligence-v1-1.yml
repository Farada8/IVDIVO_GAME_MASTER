name: Book Intelligence v1.1

on:
  push:
    paths:
      - 'tools/ivdivo_book_intelligence.py'
      - 'BOOK_INTELLIGENCE_ENGINE/**'
      - '.github/workflows/book-intelligence-v1-1.yml'
  pull_request:
    paths:
      - 'tools/ivdivo_book_intelligence.py'
      - 'BOOK_INTELLIGENCE_ENGINE/**'
      - '.github/workflows/book-intelligence-v1-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Book Intelligence regression
        run: python -m pytest -q BOOK_INTELLIGENCE_ENGINE/tests/test_book_intelligence_v1_1.py
      - name: Compile runtime
        run: python -m py_compile tools/ivdivo_book_intelligence.py
