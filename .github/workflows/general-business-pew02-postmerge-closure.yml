name: General Business P-EW02 Postmerge Closure

on:
  pull_request:
    paths:
      - 'BUSINESS_ENGINEERING_OS/CURRENT_GENERAL_BUSINESS_ENGINE.md'
      - 'BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/17_AGENT_COMMERCE_READINESS_SCANNER_V0/**'
      - 'BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/18_AGENT_COMMERCE_PEW02_BLIND10/**'
      - '.github/workflows/general-business-pew02-postmerge-closure.yml'

jobs:
  closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run calibrated scanner canaries
        run: python BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/17_AGENT_COMMERCE_READINESS_SCANNER_V0/tests/test_scanner.py
      - name: Validate P-EW02 durable closure and CURRENT frontier
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1')
          scanner = json.loads((root/'17_AGENT_COMMERCE_READINESS_SCANNER_V0/01_MACHINE_STATE.json').read_text())
          result = (root/'18_AGENT_COMMERCE_PEW02_BLIND10/02_BLIND10_RESULTS_AND_SCANNER_PATCH.md').read_text()
          st = json.loads((root/'18_AGENT_COMMERCE_PEW02_BLIND10/03_MACHINE_STATE.json').read_text())
          obs = json.loads((root/'18_AGENT_COMMERCE_PEW02_BLIND10/04_OBSERVATIONS_COMPACT.json').read_text())
          current = Path('BUSINESS_ENGINEERING_OS/CURRENT_GENERAL_BUSINESS_ENGINE.md').read_text()
          spec = (root/'17_AGENT_COMMERCE_READINESS_SCANNER_V0/00_SPEC.md').read_text()
          assert scanner['ruleset_version'] == '2026-08-22.2'
          assert scanner['p_ew02']['executed'] is True
          assert scanner['p_ew02']['decision'] == 'PASS_TEST'
          assert scanner['p_ew02']['scanner_false_negative_findings_corrected'] == 8
          assert st['authority']['implementation_pr'] == 353
          assert st['authority']['implementation_merge_sha'] == '0f83a4b223b8355b7163616d2a2cec527ec228db'
          assert st['authority']['ci_status'] == 'SUCCESS_7_OF_7'
          assert st['blind_test']['sample_size'] == 10
          assert st['blind_test']['http_200_ucp_profiles'] == 4
          assert st['blind_test']['sample_substitution'] is False
          assert st['proof_boundary']['buyer_demand'] is False
          assert st['proof_boundary']['willingness_to_pay'] is None
          assert st['proof_boundary']['proof_promotion'] is False
          assert st['drive']['readback_status'] == 'PASS'
          assert len(obs['observations']) == 10
          assert sum(x['http_status'] == 200 for x in obs['observations']) == 4
          assert all(x['oai_feed_evidence'] == 'UNKNOWN' for x in obs['observations'])
          assert '8 false-negative findings' in result
          assert '2026-08-22.2' in spec
          assert 'P-EW02 = EXECUTED / PASS_TEST' in current
          assert 'P-EW03 = NEXT' in current
          assert 'CURRENT-GENERAL-BUSINESS-PEW02-CLOSED-PEW03-NEXT-20260822' in current
          print('P-EW02 CLOSURE: PASS — PR353/CI7, 4 UCP200, ruleset .2, Drive PASS, P-EW03 next')
          PY
