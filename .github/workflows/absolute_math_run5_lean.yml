name: Absolute Mathematics Run5 Lean

on:
  push:
    branches:
      - "absolute-math-run5-amsi225-256-2026-08-21"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lean-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap pinned Lean and generate Lake manifest
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          cd ABSOLUTE_MATHEMATICS/RUN5_AMSI225_256_2026-08-21/formal/lean
          lean --version
          lake --version
          lake update
          test -s lake-manifest.json

      - name: Lean build + independent nanoda no-sorry check
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: ABSOLUTE_MATHEMATICS/RUN5_AMSI225_256_2026-08-21/formal/lean
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
          nanoda: true
          nanoda-allow-sorry: false

      - name: Source escape audit
        shell: bash
        run: |
          set -euo pipefail
          FILE=ABSOLUTE_MATHEMATICS/RUN5_AMSI225_256_2026-08-21/formal/lean/AbsoluteMathRun5.lean
          if grep -En '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "$FILE"; then
            echo "forbidden proof escape detected"
            exit 1
          fi
