name: ROOM917 RU Cast Review Ledger

on:
  pull_request:
    paths:
      - '.github/workflows/room917-ru-cast-review-ledger.yml'
      - 'AUDIO_PRODUCTION/ROOM917/RU_PILOT/ROOM917_RU_PRE_CANARY_BINDING_REVIEW_TEMPLATE_v1.0.json'
      - 'AUDIO_PRODUCTION/ROOM917/RU_PILOT/ROOM917_RU_CAST_REVIEW_TEMPLATE_v1.0.json'
      - 'AUDIO_PRODUCTION/ROOM917/RU_PILOT/tools/prepare_ru_bindings_candidate.py'
      - 'AUDIO_PRODUCTION/ROOM917/RU_PILOT/tests/test_prepare_ru_bindings_candidate.py'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/room917-ru-cast-review-ledger.yml'
      - 'AUDIO_PRODUCTION/ROOM917/RU_PILOT/ROOM917_RU_PRE_CANARY_BINDING_REVIEW_TEMPLATE_v1.0.json'
      - 'AUDIO_PRODUCTION/ROOM917/RU_PILOT/ROOM917_RU_CAST_REVIEW_TEMPLATE_v1.0.json'
      - 'AUDIO_PRODUCTION/ROOM917/RU_PILOT/tools/prepare_ru_bindings_candidate.py'
      - 'AUDIO_PRODUCTION/ROOM917/RU_PILOT/tests/test_prepare_ru_bindings_candidate.py'

permissions:
  contents: read

jobs:
  test-review-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run RU pre-canary bindings candidate tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest AUDIO_PRODUCTION/ROOM917/RU_PILOT/tests/test_prepare_ru_bindings_candidate.py -v

      - name: Assert pre-canary review cannot claim acting evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('AUDIO_PRODUCTION/ROOM917/RU_PILOT/ROOM917_RU_PRE_CANARY_BINDING_REVIEW_TEMPLATE_v1.0.json')
          row=json.loads(p.read_text(encoding='utf-8'))
          if row.get('status') != 'PRE_CANARY_REVIEW_PENDING':
              raise SystemExit('pre-canary template status drifted')
          if row.get('acting_evidence_complete') is not False:
              raise SystemExit('pre-canary review must not claim acting evidence')
          if row.get('pair_tests') != 'NOT_RUN_YET':
              raise SystemExit('pre-canary pair tests must be NOT_RUN_YET')
          if row.get('founder_cast_credibility') != 'NOT_RUN_YET':
              raise SystemExit('pre-canary Founder cast credibility must be NOT_RUN_YET')
          for field in ('paid_s0_authorized','cast_lock','full_e01_render_allowed'):
              if row.get(field) is not False:
                  raise SystemExit(f'{field} must be false in pre-canary template')
          if any((r.get('selected_voice_id') or '') for r in (row.get('roles') or {}).values()):
              raise SystemExit('checked-in pre-canary template must not contain selected voice IDs')
          print('PASS_PRE_CANARY_REVIEW_BOUNDARY')
          PY

      - name: Assert post-canary review requires real audio evidence and remains unlocked
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('AUDIO_PRODUCTION/ROOM917/RU_PILOT/ROOM917_RU_CAST_REVIEW_TEMPLATE_v1.0.json')
          row=json.loads(p.read_text(encoding='utf-8'))
          if row.get('status') != 'POST_CANARY_REVIEW_PENDING':
              raise SystemExit('post-canary template status drifted')
          if row.get('acting_evidence_complete') is not False:
              raise SystemExit('checked-in post-canary template must remain incomplete')
          if row.get('cast_lock') is not False or row.get('full_e01_render_allowed') is not False:
              raise SystemExit('post-canary template must not pre-grant lock or E01 render')
          for role, r in (row.get('roles') or {}).items():
              if r.get('accepted_canary_ids') or r.get('accepted_canary_sha256'):
                  raise SystemExit(f'{role}: checked-in template must not contain fabricated audio evidence')
          print('PASS_POST_CANARY_REVIEW_BOUNDARY')
          PY
