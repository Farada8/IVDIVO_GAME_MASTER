name: General Business Early Wave Monetization Bridge

on:
  pull_request:
    paths:
      - 'BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/19_EARLY_WAVE_MONETIZATION_BRIDGE.md'
      - 'BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/20_MONETIZATION_LADDER_STATE.json'
      - 'BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/21_PEW05_WIP3_MONETIZATION_DECISION.md'
      - 'BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/runtime/monetization_ladder.py'
      - 'BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/tests/test_monetization_ladder.py'
      - 'BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/tests/test_pew05_wip3.py'
      - '.github/workflows/general-business-early-wave-monetization.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run monetization regression
        run: python BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/tests/test_monetization_ladder.py
      - name: Run P-EW05 transition regression
        run: python -m pytest -q BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/tests/test_pew05_wip3.py
      - name: Compile runtime
        run: python -m compileall -q BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/runtime
      - name: Validate current WIP routing after P-EW03/P-EW04
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1')
          state = json.loads((root/'20_MONETIZATION_LADDER_STATE.json').read_text())
          scanner = json.loads((root/'17_AGENT_COMMERCE_READINESS_SCANNER_V0/01_MACHINE_STATE.json').read_text())
          doc = (root/'19_EARLY_WAVE_MONETIZATION_BRIDGE.md').read_text()

          assert scanner['ruleset_version'] == '2026-08-22.2'
          assert scanner['p_ew01']['executed'] is True
          assert scanner['p_ew02']['executed'] is True
          assert scanner['p_ew02']['blind_sample'] == 10
          assert scanner['p_ew02']['decision'] == 'PASS_TEST'
          assert scanner['proof_boundary']['buyer_demand'] is False
          assert scanner['proof_boundary']['wtp'] == 'UNKNOWN'
          assert scanner['proof_boundary']['platform_approval'] is False

          routes = state['current_routes']
          for oid in ('OW-01','CF-01','CF-03'):
              assert routes[oid]['route'] == 'M1_FIXED_SCOPE_DIAGNOSTIC_SPEC_READY_NOT_WTP_PROVEN'
              assert routes[oid]['technical_artifact'] is True
              assert routes[oid]['nontrivial_delta'] is True
              assert routes[oid]['paid_diagnostic_transactions'] == 0
              assert routes[oid]['wtp'] is None
          assert state['p_ew05']['decision'] == 'NO_COMMERCIAL_WINNER_YET'
          assert state['p_ew05']['m1_count'] == 3
          assert state['p_ew05']['m2_or_higher_count'] == 0
          assert state['software_promotion_gate']['min_independent_customer_contexts_same_workflow'] == 3
          assert state['software_promotion_gate']['software_candidate_is_saas_proven'] is False
          assert state['external_action']['authorized'] is False
          assert len(state['contracts']) == 12
          assert 'TECHNICAL_ARTIFACT != WTP' in doc
          assert 'ALL THREE WIP LANES ARE NOW M1' in doc
          print('EARLY_WAVE_MONETIZATION_BRIDGE P-EW05: PASS')
          PY
