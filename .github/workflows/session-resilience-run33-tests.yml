name: Session Resilience Run33 Tests

on:
  push:
    paths:
      - 'tools/ivdivo_durable_write_reconciler.py'
      - 'tools/ivdivo_checkpoint_lineage.py'
      - 'tools/ivdivo_interruption_learning.py'
      - 'schemas/IVDIVO_DURABLE_WRITE_TRANSACTION_SCHEMA_v1.json'
      - 'schemas/IVDIVO_CHECKPOINT_LINEAGE_SCHEMA_v1.json'
      - 'schemas/IVDIVO_INTERRUPTION_LEARNING_EVENT_SCHEMA_v1.json'
      - 'tests/test_session_resilience_run33.py'
      - '31_IDEAS/CURRENT_IMPROVEMENT_REGISTRY_FAMILY.json'
      - '31_IDEAS/REGISTRY_EXTENSIONS/SI-0014_SESSION_RESILIENCE_DURABLE_RECOVERY.json'
      - 'CURRENT_IVDIVO_ENGINE_MACHINE_EXECUTION.json'
      - 'PROJECT_STATES/00_PROJECT_STATE_COVERAGE_INDEX.json'
      - '.github/workflows/session-resilience-run33-tests.yml'
  pull_request:
    paths:
      - 'tools/ivdivo_durable_write_reconciler.py'
      - 'tools/ivdivo_checkpoint_lineage.py'
      - 'tools/ivdivo_interruption_learning.py'
      - 'schemas/IVDIVO_DURABLE_WRITE_TRANSACTION_SCHEMA_v1.json'
      - 'schemas/IVDIVO_CHECKPOINT_LINEAGE_SCHEMA_v1.json'
      - 'schemas/IVDIVO_INTERRUPTION_LEARNING_EVENT_SCHEMA_v1.json'
      - 'tests/test_session_resilience_run33.py'
      - '31_IDEAS/CURRENT_IMPROVEMENT_REGISTRY_FAMILY.json'
      - '31_IDEAS/REGISTRY_EXTENSIONS/SI-0014_SESSION_RESILIENCE_DURABLE_RECOVERY.json'
      - 'CURRENT_IVDIVO_ENGINE_MACHINE_EXECUTION.json'
      - 'PROJECT_STATES/00_PROJECT_STATE_COVERAGE_INDEX.json'
      - '.github/workflows/session-resilience-run33-tests.yml'
  workflow_dispatch:

jobs:
  run33:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install inherited test dependency
        run: python -m pip install --upgrade pytest
      - name: Run Run33 recovery tests
        run: python -m unittest tests.test_session_resilience_run33 -v
      - name: Run session checkpoint regression
        run: python -m unittest tests.test_session_checkpoint -v
      - name: Run registry transaction regression
        run: python -m pytest tests/test_registry_transaction.py -q
      - name: Validate registry family references
        run: python tools/validate_improvement_registry_refs.py --repo-root .
      - name: Validate portfolio resumability claim
        run: python tools/validate_project_state_coverage.py
