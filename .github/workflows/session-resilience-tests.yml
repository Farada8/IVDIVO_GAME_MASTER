name: Session Resilience Tests

on:
  push:
    paths:
      - 'tools/ivdivo_session_checkpoint.py'
      - 'schemas/IVDIVO_SESSION_CHECKPOINT_SCHEMA_v1.json'
      - 'tests/test_session_checkpoint.py'
      - 'IVDIVO_NARRATIVE_OS/18C_VOLATILE_SESSION_CHECKPOINT_AND_RECOVERY_PROTOCOL_v1.0.md'
      - 'CURRENT_IVDIVO_ENGINE_MACHINE_EXECUTION.json'
      - '.github/workflows/session-resilience-tests.yml'
  pull_request:
    paths:
      - 'tools/ivdivo_session_checkpoint.py'
      - 'schemas/IVDIVO_SESSION_CHECKPOINT_SCHEMA_v1.json'
      - 'tests/test_session_checkpoint.py'
      - 'IVDIVO_NARRATIVE_OS/18C_VOLATILE_SESSION_CHECKPOINT_AND_RECOVERY_PROTOCOL_v1.0.md'
      - 'CURRENT_IVDIVO_ENGINE_MACHINE_EXECUTION.json'
      - '.github/workflows/session-resilience-tests.yml'
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run session resilience unit tests
        run: python -m unittest tests.test_session_checkpoint -v
