name: Durable Interface Run35 Tests

on:
  pull_request:
    paths:
      - 'tools/ivdivo_durable_transaction_interface.py'
      - 'tools/ivdivo_durable_write_reconciler.py'
      - 'tools/ivdivo_interruption_learning.py'
      - 'tests/test_durable_transaction_interface.py'
      - 'tests/test_session_resilience.py'
      - 'tests/test_session_resilience_run33.py'
      - 'tests/test_registry_transaction.py'
      - 'schemas/IVDIVO_DURABLE_TRANSACTION_INTERFACE_SCHEMA_v1.json'
      - 'ENGINEERING_CONTRACTS/DURABLE_TRANSACTION_INTERFACE_v1.0.md'
      - '.github/workflows/durable-interface-run35-tests.yml'
  workflow_dispatch:

jobs:
  convergence-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Run Run35 convergence regressions
        run: python -m pytest -q tests/test_durable_transaction_interface.py
      - name: Run inherited session resilience regressions
        run: python -m pytest -q tests/test_session_resilience.py tests/test_session_resilience_run33.py
      - name: Run inherited registry transaction regressions
        run: python -m pytest -q tests/test_registry_transaction.py
      - name: Validate new schema JSON
        run: python -m json.tool schemas/IVDIVO_DURABLE_TRANSACTION_INTERFACE_SCHEMA_v1.json >/dev/null
