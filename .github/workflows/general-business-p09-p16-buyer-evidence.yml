name: General Business P09-P16 Buyer Evidence

on:
  pull_request:
    paths:
      - 'BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/**'
      - '.github/workflows/general-business-p09-p16-buyer-evidence.yml'

jobs:
  buyer-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run buyer-evidence regression
        run: python BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/tests/test_buyer_evidence_router.py
      - name: Preserve fatal-test regression
        run: python BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/tests/test_fatal_test_router.py
      - name: Compile runtime
        run: python -m compileall -q BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/runtime
      - name: Validate P09-P16 historical closure and forward-compatible current state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1')
          doc = (root/'11_P09_P16_BUYER_PROBLEM_EVIDENCE.md').read_text()
          st = json.loads((root/'12_P09_P16_MACHINE_STATE.json').read_text())
          current = json.loads((root/'06_MACHINE_STATE.json').read_text())
          assert all(f'P{i:02d}' in doc for i in range(9,17))
          assert all(f'OPP-{i}' in doc for i in (33,36,37))
          assert 'PUBLIC_SCREENING_CANDIDATE != BUYER != BUDGET_OWNER != DEMAND' in doc
          assert st['next64']['executed_count'] == 24
          assert st['next64']['unexecuted_count'] == 40
          assert st['portfolio']['wip_count'] == 3
          assert st['evidence']['buyer_behavior_observed'] is False
          assert st['evidence']['willingness_to_pay'] is None
          assert st['external_action']['authorized'] is False
          assert current['next64']['executed'] >= 24
          assert current['next64']['remaining'] <= 40
          assert 'P09-P16' in current['next64']['executed_ranges']
          assert current['buyer_problem_evidence']['screening_slots_per_lane'] == 10
          assert current['buyer_problem_evidence']['buyer_behavior_observed'] is False
          assert current['external_action']['authorized'] is False
          print(f"GENERAL_BUSINESS_P09_P16: PASS — historical 24/64 preserved; current={current['next64']['executed']}/64")
          PY
