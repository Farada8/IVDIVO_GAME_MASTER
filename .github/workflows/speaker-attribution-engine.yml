name: IVDIVO Speaker Attribution Engine

on:
  pull_request:
    paths:
      - 'tools/ivdivo_speaker_attribution.py'
      - 'tests/test_ivdivo_speaker_attribution.py'
      - 'AUDIO_PRODUCTION/IVDIVO_AUDIO_SPEAKER_ATTRIBUTION_EVIDENCE_CONTRACT_v1.0.md'
      - 'AUDIO_PRODUCTION/UNIVERSAL_AUDIO_NOVEL_ENGINE/IVDIVO_SPEAKER_ATTRIBUTION_EVIDENCE_CONTRACT_v2.md'
      - 'AUDIO_PRODUCTION/UNIVERSAL_AUDIO_NOVEL_ENGINE/IVDIVO_SPEAKER_ATTRIBUTION_ENGINE_v1.0.md'
      - 'AUDIO_PRODUCTION/UNIVERSAL_AUDIO_NOVEL_ENGINE/IVDIVO_SPEAKER_ATTRIBUTION_RULE_REGISTRY_v1.json'
      - '.github/workflows/speaker-attribution-engine.yml'

jobs:
  speaker-attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run speaker-attribution regression
        run: python -m pytest -q tests/test_ivdivo_speaker_attribution.py
      - name: Compile runtime
        run: python -m py_compile tools/ivdivo_speaker_attribution.py
