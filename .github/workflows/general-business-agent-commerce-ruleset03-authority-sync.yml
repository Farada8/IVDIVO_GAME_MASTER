name: General Business Agent Commerce Ruleset03 Authority Sync

on:
  pull_request:
    paths:
      - 'BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/17_AGENT_COMMERCE_READINESS_SCANNER_V0/**'
      - 'BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/18_AGENT_COMMERCE_PEW02_BLIND10/05_RULESET_03_PUBLIC_EVIDENCE_CORRECTION.md'
      - '.github/workflows/general-business-agent-commerce-ruleset03-authority-sync.yml'

jobs:
  authority-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run current scanner regression
        run: python BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/17_AGENT_COMMERCE_READINESS_SCANNER_V0/tests/test_scanner.py
      - name: Assert runtime-state-spec agreement
        run: |
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path
          root=Path('BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1')
          scanner_path=root/'17_AGENT_COMMERCE_READINESS_SCANNER_V0/scanner.py'
          spec=importlib.util.spec_from_file_location('scanner', scanner_path)
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          state=json.loads((root/'17_AGENT_COMMERCE_READINESS_SCANNER_V0/01_MACHINE_STATE.json').read_text())
          doc=(root/'17_AGENT_COMMERCE_READINESS_SCANNER_V0/00_SPEC.md').read_text()
          receipt=(root/'18_AGENT_COMMERCE_PEW02_BLIND10/05_RULESET_03_PUBLIC_EVIDENCE_CORRECTION.md').read_text()
          assert mod.RULESET_VERSION=='2026-08-22.3'
          assert state['ruleset_version']==mod.RULESET_VERSION
          assert state['post_pew05_correction']['pr']==387
          assert state['post_pew05_correction']['p_ew05_route_changed'] is False
          assert state['current_public_evidence_policy']['order_capability_without_proven_webhook_flow_and_missing_signing_keys']=='UNKNOWN_NOT_FAIL'
          assert 'Current ruleset:** `2026-08-22.3`' in doc
          assert 'PUBLIC_ORDER_CAPABILITY != PROVEN_WEBHOOK_FLOW' in receipt
          assert 'P-EW05_M1_ROUTE_UNCHANGED' in receipt
          print('RULESET03 AUTHORITY SYNC: PASS')
          PY
