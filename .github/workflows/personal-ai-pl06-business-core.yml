name: Personal AI PL-06 Business Core

on:
  pull_request:
    paths:
      - 'personal-ai/**'
      - '.github/workflows/personal-ai-pl06-business-core.yml'

jobs:
  pl06-business-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline PL-06 quote smoke
        run: |
          HOME_DIR="$(mktemp -d)"
          REQUEST="$(mktemp)"
          python personal-ai/run.py --home "$HOME_DIR" project create ci-business
          cat > "$REQUEST" <<'JSON'
          {
            "quote_id":"ci-quote",
            "job_id":"ci-job",
            "client_request":"synthetic CI request",
            "job_type":"fixture",
            "hours":"2",
            "labour_rate":"10.00",
            "materials":[],
            "materials_not_required":true,
            "margin_percent":"10",
            "currency":"EUR"
          }
          JSON
          python personal-ai/run.py --home "$HOME_DIR" business quote ci-business "$REQUEST"
      - name: Run PL-06 tests
        run: python -m unittest personal-ai/tests/test_business_core.py -v
      - name: Run full Personal AI regression suite
        run: python -m unittest discover -s personal-ai/tests -v
