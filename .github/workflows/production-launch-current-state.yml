name: Production Launch Current State Guard

on:
  pull_request:
    paths:
      - 'SELF_IMPROVEMENT_ENGINE/PRODUCTION_LAUNCH_2026-08-22/CURRENT_PRODUCTION_LAUNCH_STATE.json'
      - 'SELF_IMPROVEMENT_ENGINE/PRODUCTION_LAUNCH_2026-08-22/CURRENT_HANDOFF.md'
      - 'SELF_IMPROVEMENT_ENGINE/PRODUCTION_LAUNCH_2026-08-22/PL*_VERIFICATION_RECEIPT.json'
      - 'SELF_IMPROVEMENT_ENGINE/PRODUCTION_LAUNCH_2026-08-22/PRODUCTION_LAUNCH_QUEUE_v0.1.json'
      - '.github/workflows/production-launch-current-state.yml'

jobs:
  current-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate CURRENT overlay generically
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('SELF_IMPROVEMENT_ENGINE/PRODUCTION_LAUNCH_2026-08-22')
          base = json.loads((root / 'PRODUCTION_LAUNCH_QUEUE_v0.1.json').read_text())
          current = json.loads((root / 'CURRENT_PRODUCTION_LAUNCH_STATE.json').read_text())

          assert current['authority_effect'] == 'NONE'
          assert current['self_improvement_authority'] == 'V2_VERIFIED_CURRENT'
          assert current['base_queue'] == 'PRODUCTION_LAUNCH_QUEUE_v0.1.json'

          cards = {card['id']: dict(card) for card in base['cards']}
          allowed = set(base['statuses'])
          for card_id, status in current.get('status_overrides', {}).items():
              assert card_id in cards, f'unknown overlay card: {card_id}'
              assert status in allowed, f'invalid status: {status}'
              cards[card_id]['status'] = status

          done = {cid for cid, card in cards.items() if card['status'] == 'DONE_VERIFIED'}
          for cid, card in cards.items():
              deps = set(card.get('depends_on') or [])
              missing = deps - done
              if card['status'] in {'READY', 'RUNNING'}:
                  assert not missing, f'{cid} is {card["status"]} with missing dependencies {sorted(missing)}'
              elif card['status'] == 'WAITING_DEPENDENCY':
                  assert missing, f'{cid} is WAITING_DEPENDENCY but all dependencies are DONE_VERIFIED'

          frontier = current['current_frontier']
          assert frontier in cards, f'unknown frontier: {frontier}'
          assert cards[frontier]['status'] in {'READY', 'RUNNING'}, (
              f'frontier {frontier} must be READY/RUNNING, got {cards[frontier]["status"]}'
          )

          for cid in current.get('newly_closed', []):
              assert cid in cards and cards[cid]['status'] == 'DONE_VERIFIED', (
                  f'newly_closed card is not DONE_VERIFIED: {cid}'
              )
          for cid in current.get('newly_unlocked', []):
              assert cid in cards and cards[cid]['status'] == 'READY', (
                  f'newly_unlocked card is not READY: {cid}'
              )

          for cid, proof in current.get('proof', {}).items():
              assert cid in cards, f'proof references unknown card: {cid}'
              assert cards[cid]['status'] == 'DONE_VERIFIED', f'proof card is not DONE_VERIFIED: {cid}'
              receipt_path = root / f'{cid.replace("-", "")}_VERIFICATION_RECEIPT.json'
              if not receipt_path.exists():
                  continue
              receipt = json.loads(receipt_path.read_text())
              assert receipt.get('card') == cid, f'receipt card mismatch for {cid}'
              assert receipt.get('status') == 'DONE_VERIFIED', f'receipt not DONE_VERIFIED for {cid}'
              receipt_merge = (receipt.get('implementation') or {}).get('merge_sha') or receipt.get('merge_sha')
              if proof.get('merge_sha') and receipt_merge:
                  assert proof['merge_sha'] == receipt_merge, f'merge SHA mismatch for {cid}'
              drive = receipt.get('drive') or {}
              receipt_marker = drive.get('verified_marker') or drive.get('marker') or receipt.get('drive_marker')
              if proof.get('drive_marker') and receipt_marker:
                  assert proof['drive_marker'] == receipt_marker, f'Drive marker mismatch for {cid}'

          handoff = (root / 'CURRENT_HANDOFF.md').read_text()
          assert frontier in handoff, f'CURRENT_HANDOFF does not mention frontier {frontier}'
          print(f'Production Launch CURRENT overlay valid; frontier={frontier}; done={len(done)}')
          PY
