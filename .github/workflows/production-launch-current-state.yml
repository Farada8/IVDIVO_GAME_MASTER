name: Production Launch Current State Guard

on:
  pull_request:
    paths:
      - 'SELF_IMPROVEMENT_ENGINE/PRODUCTION_LAUNCH_2026-08-22/CURRENT_PRODUCTION_LAUNCH_STATE.json'
      - 'SELF_IMPROVEMENT_ENGINE/PRODUCTION_LAUNCH_2026-08-22/CURRENT_HANDOFF.md'
      - 'SELF_IMPROVEMENT_ENGINE/PRODUCTION_LAUNCH_2026-08-22/PL*_VERIFICATION_RECEIPT.json'
      - 'SELF_IMPROVEMENT_ENGINE/PRODUCTION_LAUNCH_2026-08-22/PRODUCTION_LAUNCH_QUEUE_v0.1.json'
      - '.github/workflows/production-launch-current-state.yml'

jobs:
  current-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate overlay, dependency closure and receipts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('SELF_IMPROVEMENT_ENGINE/PRODUCTION_LAUNCH_2026-08-22')
          base = json.loads((root / 'PRODUCTION_LAUNCH_QUEUE_v0.1.json').read_text())
          current = json.loads((root / 'CURRENT_PRODUCTION_LAUNCH_STATE.json').read_text())

          assert current['authority_effect'] == 'NONE'
          assert current['self_improvement_authority'] == 'V2_VERIFIED_CURRENT'
          assert current['base_queue'] == 'PRODUCTION_LAUNCH_QUEUE_v0.1.json'

          cards = {card['id']: dict(card) for card in base['cards']}
          allowed = set(base['statuses'])
          for card_id, status in current['status_overrides'].items():
              assert card_id in cards, f'unknown overlay card: {card_id}'
              assert status in allowed, f'invalid status: {status}'
              cards[card_id]['status'] = status

          done = {cid for cid, card in cards.items() if card['status'] == 'DONE_VERIFIED'}
          for cid, card in cards.items():
              deps = set(card.get('depends_on') or [])
              if card['status'] in {'READY', 'RUNNING'}:
                  missing = deps - done
                  assert not missing, f'{cid} is {card["status"]} with missing dependencies {sorted(missing)}'
              if card['status'] == 'WAITING_DEPENDENCY':
                  assert deps - done, f'{cid} is WAITING_DEPENDENCY but all dependencies are DONE_VERIFIED'

          frontier = current['current_frontier']
          assert frontier in cards, f'unknown frontier: {frontier}'
          assert cards[frontier]['status'] in {'READY', 'RUNNING'}, (
              f'frontier {frontier} must be READY or RUNNING, got {cards[frontier]["status"]}'
          )
          missing_frontier_deps = set(cards[frontier].get('depends_on') or []) - done
          assert not missing_frontier_deps, (
              f'frontier {frontier} has missing dependencies {sorted(missing_frontier_deps)}'
          )

          proof = current.get('proof') or {}
          for card_id, item in proof.items():
              if not isinstance(item, dict) or 'implementation_pr' not in item:
                  continue
              receipt_path = root / f'{card_id.replace("-", "")}_VERIFICATION_RECEIPT.json'
              assert receipt_path.is_file(), f'missing verification receipt for {card_id}: {receipt_path.name}'
              receipt = json.loads(receipt_path.read_text())
              assert receipt['card'] == card_id
              assert receipt['status'] == 'DONE_VERIFIED'
              assert cards[card_id]['status'] == 'DONE_VERIFIED'
              exact = receipt.get('exact_head_ci') or {}
              if 'all_success' in exact:
                  assert exact['all_success'] is True, f'{card_id} receipt CI is not all-success'
              implementation = receipt.get('implementation') or {}
              if item.get('merge_sha') is not None:
                  assert implementation.get('merge_sha') == item['merge_sha'], f'{card_id} merge SHA mismatch'
              drive = receipt.get('drive') or {}
              if item.get('drive_marker') is not None:
                  assert drive.get('verified_marker') == item['drive_marker'], f'{card_id} Drive marker mismatch'

          for card_id in current.get('newly_closed') or []:
              assert cards[card_id]['status'] == 'DONE_VERIFIED', f'newly_closed {card_id} is not DONE_VERIFIED'

          handoff = (root / 'CURRENT_HANDOFF.md').read_text()
          assert frontier in handoff, f'CURRENT_HANDOFF does not name frontier {frontier}'
          for card_id in current.get('newly_closed') or []:
              assert card_id in handoff and 'DONE_VERIFIED' in handoff, f'handoff missing closure context for {card_id}'

          print(f'Production Launch CURRENT overlay valid; frontier={frontier}')
          PY
