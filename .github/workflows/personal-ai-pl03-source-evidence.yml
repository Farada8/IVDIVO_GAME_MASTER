name: Personal AI PL-03 Source Evidence Layer

on:
  pull_request:
    paths:
      - 'personal-ai/**'
      - '.github/workflows/personal-ai-pl03-source-evidence.yml'

jobs:
  pl03-source-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run PL-03 evidence tests
        run: python -m unittest personal-ai/tests/test_source_evidence_layer.py -v
      - name: Run full Personal AI regression suite
        run: python -m unittest discover -s personal-ai/tests -v
