name: ROOM917 E01 A01-A02 SFX Canary

on:
  workflow_dispatch:
    inputs:
      confirm_spend:
        description: 'Type YES to authorize this bounded paid SFX canary only'
        required: true
        type: string
      max_requests:
        description: '2 = one candidate per room bed; 4 = two candidates per room bed'
        required: true
        default: '2'
        type: choice
        options:
          - '2'
          - '4'

permissions:
  contents: read

jobs:
  bounded-sfx-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Spend gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_spend }}" != "YES" ]; then
            echo '::error::Paid SFX canary blocked. confirm_spend must be exactly YES.'
            exit 20
          fi
          case "${{ inputs.max_requests }}" in
            2|4) ;;
            *) echo '::error::max_requests must be 2 or 4'; exit 21 ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Toolchain gate
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            AUDIO_PRODUCTION/ROOM917/SOUND_DESIGN/tools/render_a01_a02_sfx_canary.py \
            AUDIO_PRODUCTION/ROOM917/SOUND_DESIGN/tools/prepare_a01_a02_candidate_qc.py
          ffmpeg -version >/dev/null

      - name: Provider secret gate
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ELEVENLABS_API_KEY:-}" ]; then
            echo '::error::ELEVENLABS_API_KEY repository secret is absent. Do not paste the key into logs or workflow inputs.'
            exit 22
          fi

      - name: Validate provider adapter against current generation queue without spending
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          plan_path=Path('AUDIO_PRODUCTION/ROOM917/SOUND_DESIGN/ROOM917_E01_A01_A02_ELEVENLABS_SFX_CANARY_PLAN_v1.json')
          queue_path=Path('AUDIO_PRODUCTION/ROOM917/SOUND_DESIGN/ROOM917_E01_SOUND_ASSET_GENERATION_AND_AUDITION_QUEUE_v1.json')
          data=json.loads(plan_path.read_text(encoding='utf-8'))
          queue=json.loads(queue_path.read_text(encoding='utf-8'))

          assert data['project']=='ROOM917' and data['episode']=='E01'
          assert data['authority']['generation_queue'].endswith(queue_path.name)
          assert data['adapter_law']['provider_neutral_queue_is_prompt_semantic_authority'] is True
          assert data['provider']['model_id']=='eleven_text_to_sound_v2'
          assert data['provider']['loop'] is True
          assert float(data['provider']['duration_seconds'])==30.0
          assert data['provider']['dispatch'] is False
          assert len(data['requests'])==4
          assert {r['asset_id'] for r in data['requests']}=={'A01_GREYHAVEN_LOBBY_30S_LOOP','A02_SWITCHBOARD_ALCOVE_30S_LOOP'}

          qmap={row['asset_id']:{v['variant']:v['prompt'] for v in row['variants']} for row in queue['queue']}
          for r in data['requests']:
              assert len(r['text']) <= int(data['adapter_law']['provider_prompt_character_limit'])
              assert r['loop'] is True
              assert float(r['duration_seconds'])==30.0
              source=qmap[r['asset_id']][r['source_variant']]
              source_sha=hashlib.sha256(source.encode('utf-8')).hexdigest()
              assert source_sha == r['source_prompt_sha256'], (r['request_id'], source_sha, r['source_prompt_sha256'])
          print('PROVIDER_ADAPTER_AND_SOURCE_PROMPT_HASHES_VALIDATED_NO_SPEND')
          PY

      - name: Render only bounded canary candidates
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _room917_a01_a02_sfx_canary
          python AUDIO_PRODUCTION/ROOM917/SOUND_DESIGN/tools/render_a01_a02_sfx_canary.py \
            --plan AUDIO_PRODUCTION/ROOM917/SOUND_DESIGN/ROOM917_E01_A01_A02_ELEVENLABS_SFX_CANARY_PLAN_v1.json \
            --outdir _room917_a01_a02_sfx_canary \
            --max-requests "${{ inputs.max_requests }}" \
            --confirm-spend "${{ inputs.confirm_spend }}" \
            --output-format mp3_44100_128

      - name: Verify provider evidence is not a production binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('_room917_a01_a02_sfx_canary/ROOM917_E01_A01_A02_SFX_CANARY_EVIDENCE.json')
          r=json.loads(p.read_text(encoding='utf-8'))
          assert r['production_binding_authorized'] is False
          assert r['secret_persisted'] is False
          assert r['requested_count'] in (2,4)
          assert all(c['production_binding_authorized'] is False for c in r['candidates'])
          assert all(c['audition_status']=='HOLD_PENDING_LISTEN' for c in r['candidates'])
          print('PROVIDER_EVIDENCE_FAIL_CLOSED_PASS')
          PY

      - name: Normalize candidates and build listening QC pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _room917_a01_a02_sfx_canary/qc
          python AUDIO_PRODUCTION/ROOM917/SOUND_DESIGN/tools/prepare_a01_a02_candidate_qc.py \
            --evidence _room917_a01_a02_sfx_canary/ROOM917_E01_A01_A02_SFX_CANARY_EVIDENCE.json \
            --outdir _room917_a01_a02_sfx_canary/qc

      - name: Verify machine QC remains human-gated
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          q=Path('_room917_a01_a02_sfx_canary/qc/ROOM917_E01_A01_A02_MACHINE_QC.json')
          r=json.loads(q.read_text(encoding='utf-8'))
          assert r['status']=='PREPARED_FOR_HUMAN_AUDITION_NOT_BOUND'
          assert r['machine_may_award_artistic_pass'] is False
          assert r['production_binding_authorized'] is False
          assert r['candidate_count'] in (2,4)
          assert all(row['production_binding_authorized'] is False for row in r['rows'])
          pending=json.loads(Path('_room917_a01_a02_sfx_canary/qc/ROOM917_E01_A01_A02_PENDING_HUMAN_CANDIDATES.json').read_text(encoding='utf-8'))
          assert pending['status']=='MULTIPLE_CANDIDATES_PENDING_HUMAN_SELECTION_NOT_BINDABLE'
          print('QC_HUMAN_GATE_PASS')
          PY

      - name: Upload canary evidence, normalized WAVs and QC previews
        uses: actions/upload-artifact@v4
        with:
          name: ROOM917_E01_A01_A02_SFX_CANARY_${{ github.run_id }}
          path: _room917_a01_a02_sfx_canary/
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ROOM917 E01 A01/A02 Sound Effects Canary
          - provider-neutral generation queue remains prompt semantic authority
          - provider prompt adapter is hash-linked to source variants and limited to <=450 characters
          - paid execution occurred only after explicit `confirm_spend=YES`
          - requested candidate count is bounded to 2 or 4
          - provider model: `eleven_text_to_sound_v2`
          - each candidate: 30-second loop request
          - candidates are normalized to 48k/24-bit/stereo and get seam/mono/phone listening previews
          - machine QC cannot award artistic PASS
          - production binding: FORBIDDEN until human audition + dialogue underlay + explicit gain + existing identity binding gate
          - D003 patch authority: NOT granted by candidate generation or audition alone
          - full E01 render: NOT part of this workflow
          EOF
