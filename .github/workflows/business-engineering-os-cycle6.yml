name: Business Engineering OS Cycle6 Procurement Hardening

on:
  pull_request:
    paths:
      - 'BUSINESS_ENGINEERING_OS/2026-08-22_CYCLE6_PROCUREMENT_PA4_HARDENING/**'
      - '.github/workflows/business-engineering-os-cycle6.yml'
  push:
    branches: [main]
    paths:
      - 'BUSINESS_ENGINEERING_OS/2026-08-22_CYCLE6_PROCUREMENT_PA4_HARDENING/**'
      - '.github/workflows/business-engineering-os-cycle6.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Cycle6 procurement regressions
        run: python -m unittest discover -s BUSINESS_ENGINEERING_OS/2026-08-22_CYCLE6_PROCUREMENT_PA4_HARDENING/tests -p 'test_*.py' -v
