name: General Business Discovery Production Engine v1

on:
  pull_request:
    paths:
      - 'BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/**'
      - '.github/workflows/general-business-discovery-production-engine-v1.yml'

jobs:
  engine-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run cumulative business regressions
        run: |
          python BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/tests/test_business_production_router.py
          python BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/tests/test_fatal_test_router.py
          python BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/tests/test_buyer_evidence_router.py
          python BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/tests/test_test37_ai_vs_seo.py
          if [ -f BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/tests/test_opp37_offer_router.py ]; then
            python BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/tests/test_opp37_offer_router.py
          fi
      - name: Compile runtime
        run: python -m compileall -q BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/runtime
      - name: Validate architecture and current General Business state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1')
          spec = (root/'01_ENGINEERING_SPEC.md').read_text()
          run = (root/'03_RUN32_EXECUTION.md').read_text()
          nxt = (root/'05_NEXT64.md').read_text()
          p0108 = (root/'07_P01_P08_DISCOVERY_REFRESH.md').read_text()
          src = (root/'08_P01_P08_SOURCE_LEDGER.md').read_text()
          p1724 = (root/'09_P17_P24_FATAL_ASSUMPTION_PORTFOLIO.md').read_text()
          fatal_state = json.loads((root/'10_P17_P24_MACHINE_STATE.json').read_text())
          p0916 = (root/'11_P09_P16_BUYER_PROBLEM_EVIDENCE.md').read_text()
          buyer_state = json.loads((root/'12_P09_P16_MACHINE_STATE.json').read_text())
          offer_doc = root/'17_OPP37_P25_P32_OFFER_ENGINEERING.md'
          offer_state_path = root/'18_OPP37_P25_P32_MACHINE_STATE.json'
          state = json.loads((root/'06_MACHINE_STATE.json').read_text())
          assert all(f'BDP{i:02d}' in spec for i in range(1,33))
          assert all(f'CDP{i:02d}' in spec for i in range(1,33))
          assert 'KEEP / KEEP-with-ordering:** 21' in run
          assert '**MUTATE:** 11' in run
          assert all(f'P{i:02d}' in nxt for i in range(1,65))
          assert 'Prompt count never substitutes for evidence' in (root/'00_MASTER.md').read_text()
          assert state['discovery_refresh']['fresh_non_procurement_signals'] == 10
          assert state['discovery_refresh']['wip_count'] == 3
          assert state['discovery_refresh']['willingness_to_pay'] is None
          assert state['discovery_refresh']['unit_economics'] is None
          assert 'OPP-33' in p0108 and 'OPP-36' in p0108 and 'OPP-37' in p0108
          assert 'WILLINGNESS_TO_PAY = UNKNOWN' in p0108
          assert 'OFFICIAL_SUPPORT_EXISTENCE != BUYER_WTP' in src
          assert fatal_state['next64']['executed_count'] == 16
          assert fatal_state['external_action']['authorized'] is False
          assert buyer_state['next64']['executed_count'] == 24
          assert buyer_state['external_action']['authorized'] is False
          assert buyer_state['evidence']['buyer_behavior_observed'] is False
          assert 'PUBLIC_SCREENING_CANDIDATE != BUYER != BUDGET_OWNER != DEMAND' in p0916
          assert state['test37_internal']['count'] == 2
          assert state['test37_internal']['buyer_behavior'] is False
          assert state['external_action']['authorized'] is False
          if offer_doc.exists() and offer_state_path.exists():
              offer = offer_doc.read_text()
              ost = json.loads(offer_state_path.read_text())
              assert all(f'P{i}' in offer for i in range(25,33))
              assert ost['next64']['executed'] == 32
              assert ost['next64']['remaining'] == 32
              assert ost['p29_pricing_hypothesis']['wtp_proven'] is False
              assert ost['p29_pricing_hypothesis']['minimum_viable_price'] is None
              assert ost['evidence']['unit_economics'] is None
              assert ost['evidence']['profitability'] is None
              assert ost['external_action']['authorized'] is False
              assert state['next64']['executed'] == 32
              assert state['next64']['remaining'] == 32
              assert state['next64']['next_admissible_block'] == 'P33-P40_OPP37_NULL_SAFE_ECONOMICS_AND_MANUAL_DELIVERY_TIMING'
              assert state['offer_engineering']['generic_ai_seo_audit'] == 'KILL_AS_DIFFERENTIATED_CORE'
              assert state['offer_engineering']['buyer_value_proven'] is False
          print(f"GENERAL_BUSINESS_ENGINE: PASS — current={state['next64']['executed']}/64, route={state['next64']['next_admissible_block']}")
          PY
