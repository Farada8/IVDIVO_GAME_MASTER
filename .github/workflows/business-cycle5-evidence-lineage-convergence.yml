name: Business Cycle5 Evidence Lineage Convergence

on:
  pull_request:
    paths:
      - 'BUSINESS_ENGINEERING_OS/LIBRARY/FILE_LIBRARY_DISCOVERY_DELTA_2026-08-22.md'
      - 'BUSINESS_ENGINEERING_OS/2026-08-22_CYCLE5_PUBLIC_ARTIFACT_VALIDATION_32_TO_64/engine/market_evidence_lineage.py'
      - 'BUSINESS_ENGINEERING_OS/2026-08-22_CYCLE5_PUBLIC_ARTIFACT_VALIDATION_32_TO_64/engine/test_market_evidence_lineage.py'
      - 'BUSINESS_ENGINEERING_OS/2026-08-22_CYCLE5_PUBLIC_ARTIFACT_VALIDATION_32_TO_64/10_CONVERGENCE_LIBRARY_EVIDENCE_LINEAGE.md'
      - '.github/workflows/business-cycle5-evidence-lineage-convergence.yml'

permissions:
  contents: read

jobs:
  evidence-lineage-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merge ref
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run controlling Cycle5 regression suites
        working-directory: BUSINESS_ENGINEERING_OS/2026-08-22_CYCLE5_PUBLIC_ARTIFACT_VALIDATION_32_TO_64/engine
        run: |
          python -m unittest discover -p 'test_*.py' -v
