name: artifact-placement-runtime

on:
  pull_request:
    paths:
      - 'personal-ai/core/artifact_placement.py'
      - 'personal-ai/projects/artifact_completion.py'
      - 'personal-ai/tests/test_artifact_placement_runtime.py'
      - '.github/workflows/artifact-placement-runtime.yml'
  workflow_dispatch:

jobs:
  artifact-placement-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Targeted artifact placement regression
        working-directory: personal-ai
        run: python -m unittest -v tests.test_artifact_placement_runtime
      - name: Existing project-state regression
        working-directory: personal-ai
        run: python -m unittest -v tests.test_project_state
