name: Personal AI PL-02 Local Memory

on:
  pull_request:
    paths:
      - 'personal-ai/**'
      - '.github/workflows/personal-ai-pl02-local-memory.yml'

jobs:
  pl02-local-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise compatibility memory CLI
        run: |
          export PERSONAL_AI_HOME="$RUNNER_TEMP/personal-ai-pl02"
          python personal-ai/run.py memory put "CI persistent memory" --kind evidence --source ci --id ci-memory --metadata '{"scope":"pl02"}'
          python personal-ai/run.py memory search "persistent memory"
          python personal-ai/run.py memory update ci-memory "CI updated memory"
          python personal-ai/run.py memory invalidate ci-memory --reason superseded
          python personal-ai/run.py memory trace ci-memory
          test -f "$PERSONAL_AI_HOME/runtime/state.db"
      - name: Exercise strict versioned PL-02 contract
        run: |
          python - <<'PY'
          import sys, tempfile
          from pathlib import Path
          sys.path.insert(0, 'personal-ai')
          from memory.store import REQUIRED_PL02_TABLES, VersionedMemory
          with tempfile.TemporaryDirectory() as td:
              m = VersionedMemory(Path(td) / 'state.db')
              m.store('sources', 'src-ci', 'CI source', source='fixture')
              m.store('facts', 'fact-ci', 'CI versioned fact', source='src-ci', source_id='src-ci', confidence=0.8)
              m.update('facts', 'fact-ci', content='CI versioned fact updated', confidence=0.9)
              assert len(m.versions('facts', 'fact-ci')) == 2
              assert [x['id'] for x in m.trace_source('facts', 'fact-ci')['chain']] == ['fact-ci', 'src-ci']
              assert set(REQUIRED_PL02_TABLES) == {'projects','tasks','documents','facts','decisions','sources','outputs','events'}
          PY
      - name: Run full Personal AI regression suite
        run: python -m unittest discover -s personal-ai/tests -v
