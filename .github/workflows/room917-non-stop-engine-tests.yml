name: ROOM917 Non-Stop Engine Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/room917-non-stop-engine-tests.yml'
      - 'AUDIO_PRODUCTION/ROOM917/TOOLS/POST_RENDER_ENGINEERING_v2/CONTINUATION_POLICY_v1.json'
      - 'AUDIO_PRODUCTION/ROOM917/TOOLS/POST_RENDER_ENGINEERING_v2/post_render_router.py'
      - 'AUDIO_PRODUCTION/ROOM917/TOOLS/POST_RENDER_ENGINEERING_v2/build_sound_asset_blind_package.py'
      - 'AUDIO_PRODUCTION/ROOM917/TOOLS/POST_RENDER_ENGINEERING_v2/compile_sound_asset_audition_result.py'
      - 'AUDIO_PRODUCTION/ROOM917/TOOLS/POST_RENDER_ENGINEERING_v2/apply_context_gain_lock.py'
      - 'AUDIO_PRODUCTION/ROOM917/TOOLS/POST_RENDER_ENGINEERING_v2/resolve_sound_asset_semantic_timing.py'
      - 'AUDIO_PRODUCTION/ROOM917/TOOLS/POST_RENDER_ENGINEERING_v2/test_non_stop_continuation.py'
      - 'AUDIO_PRODUCTION/ROOM917/TOOLS/POST_RENDER_ENGINEERING_v2/test_context_gain_lock.py'
      - 'AUDIO_PRODUCTION/ROOM917/TOOLS/POST_RENDER_ENGINEERING_v2/test_semantic_timing_resolver.py'

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run non-stop router and blind audition tests
        working-directory: AUDIO_PRODUCTION/ROOM917/TOOLS/POST_RENDER_ENGINEERING_v2
        run: python test_non_stop_continuation.py
      - name: Run context gain lock tests
        working-directory: AUDIO_PRODUCTION/ROOM917/TOOLS/POST_RENDER_ENGINEERING_v2
        run: python test_context_gain_lock.py
      - name: Run semantic timing resolver tests
        working-directory: AUDIO_PRODUCTION/ROOM917/TOOLS/POST_RENDER_ENGINEERING_v2
        run: python test_semantic_timing_resolver.py
      - name: Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ROOM917 fail-closed non-stop policy
          Expected targeted results: 5/5 non-stop + 4/4 context-gain + 3/3 semantic-timing tests.
          - blocked mainline selects independent safe work
          - exhausted secondary work returns to recovery search
          - blind package verifies byte hashes and rejects tamper
          - audition compiler never invents production gain
          - context gain is explicit or HOLD
          - one failed asset suppresses the entire context-gain candidate set; no partial renderer promotion
          - accepted timing resolves; ambiguous timing HOLD; unaccepted timing FAIL
          EOF
