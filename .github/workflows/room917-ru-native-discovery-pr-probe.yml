name: ROOM917 RU Native Discovery PR Probe

on:
  pull_request:
    paths:
      - '.github/workflows/room917-ru-native-discovery-pr-probe.yml'
      - 'AUDIO_PRODUCTION/ROOM917/RU_PILOT/tools/probe_public_shared_voices.py'

permissions:
  contents: read

jobs:
  public-shared-voice-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Probe first 300 public Voice Library rows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _room917_ru_native_probe
          python AUDIO_PRODUCTION/ROOM917/RU_PILOT/tools/probe_public_shared_voices.py \
            --out _room917_ru_native_probe/PUBLIC_SHARED_VOICE_PROBE.json \
            --pages 100 \
            --min-notice-days 365

      - name: Add receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path('_room917_ru_native_probe/PUBLIC_SHARED_VOICE_PROBE.json')
          data=p.read_bytes(); row=json.loads(data.decode('utf-8'))
          receipt={
              'schema_version':'ivdivo.room917_public_shared_voice_probe_receipt/1.0',
              'provider':'ElevenLabs',
              'tts_calls':0,
              'paid_synthesis_calls':0,
              'authentication':'NONE',
              'voice_rows_scanned':row.get('voice_rows_scanned'),
              'ru_voice_count':row.get('ru_voice_count_in_probe'),
              'production_candidate_count':row.get('production_candidate_count_in_probe'),
              'provider_has_more_after_probe':row.get('provider_has_more_after_probe'),
              'sha256':hashlib.sha256(data).hexdigest(),
          }
          Path('_room917_ru_native_probe/PROBE_RECEIPT.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ROOM917_RU_PUBLIC_SHARED_VOICE_PROBE
          path: _room917_ru_native_probe/
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          row=json.loads(Path('_room917_ru_native_probe/PUBLIC_SHARED_VOICE_PROBE.json').read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('## ROOM917 public Voice Library probe\n')
              f.write(f"- rows scanned: {row.get('voice_rows_scanned')}\n")
              f.write(f"- RU voices found: {row.get('ru_voice_count_in_probe')}\n")
              f.write(f"- production candidates found: {row.get('production_candidate_count_in_probe')}\n")
              f.write(f"- has more after probe: {row.get('provider_has_more_after_probe')}\n")
              f.write('- paid synthesis calls: 0\n')
          PY
