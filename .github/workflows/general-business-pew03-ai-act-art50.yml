name: General Business P-EW03 AI Act Article 50 Pack

on:
  pull_request:
    paths:
      - 'BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/19_AI_ACT_ART50_TECHNICAL_TRANSPARENCY_PACK/**'
      - 'BUSINESS_ENGINEERING_OS/CURRENT_GENERAL_BUSINESS_ENGINE.md'
      - '.github/workflows/general-business-pew03-ai-act-art50.yml'

jobs:
  art50-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run routing and control-verification regressions
        run: |
          python -m pytest -q \
            BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/19_AI_ACT_ART50_TECHNICAL_TRANSPARENCY_PACK/tests/test_router.py \
            BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/19_AI_ACT_ART50_TECHNICAL_TRANSPARENCY_PACK/tests/test_control_verifier.py
      - name: Validate Article 50 JSON fixtures/state
        run: |
          python -m json.tool BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/19_AI_ACT_ART50_TECHNICAL_TRANSPARENCY_PACK/02_SYNTHETIC_SAMPLE_PACKET.json >/dev/null
          python -m json.tool BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/19_AI_ACT_ART50_TECHNICAL_TRANSPARENCY_PACK/03_MACHINE_STATE.json >/dev/null
          python -m json.tool BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/19_AI_ACT_ART50_TECHNICAL_TRANSPARENCY_PACK/05_CONTROL_VERIFICATION_FIXTURES.json >/dev/null
      - name: Run base router smoke test
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          root = Path('BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/19_AI_ACT_ART50_TECHNICAL_TRANSPARENCY_PACK')
          sys.path.insert(0, str(root))
          import router
          packet = json.loads((root/'02_SYNTHETIC_SAMPLE_PACKET.json').read_text(encoding='utf-8'))
          results = router.route_many(packet['cases'])
          assert len(results) == 6
          assert all(x['external_action_authorized'] is False for x in results)
          assert all(x['legal_compliance_proven'] is False for x in results)
          print('P-EW03 router PASS')
          PY
      - name: Run control-verification hardening smoke test
        run: |
          python BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/19_AI_ACT_ART50_TECHNICAL_TRANSPARENCY_PACK/control_verifier.py > /tmp/pew03_control_results.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/pew03_control_results.json').read_text())
          assert len(data['results']) == 8
          by_id = {x['case_id']: x for x in data['results']}
          assert by_id['CV_DEEPFAKE_MACHINE_MARK_ONLY']['overall'] == 'CONTROL_GAPS_FOUND'
          assert by_id['CV_CLOSED_LOOP_SCOPE_REVIEW']['overall'] == 'REVIEW_REQUIRED'
          assert any(x['type'] == 'LEGISLATIVE_REVIEW_REQUIRED' for x in by_id['CV_LEGACY_TRANSITION_CLAIM']['review_items'])
          assert data['legal_compliance_proven'] is False
          assert data['customer_demand_proven'] is False
          assert data['wtp_proven'] is False
          assert data['transaction_proven'] is False
          print('P-EW03 control verification PASS')
          PY
      - name: Compile P-EW03 runtime
        run: python -m compileall BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/19_AI_ACT_ART50_TECHNICAL_TRANSPARENCY_PACK
