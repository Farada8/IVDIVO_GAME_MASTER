name: Business Current Read Model Guard

on:
  pull_request:
    paths:
      - 'BUSINESS_ENGINEERING_OS/CURRENT_BUSINESS_ENGINEERING_AUTHORITY.md'
      - 'BUSINESS_ENGINEERING_OS/CURRENT_BUSINESS_ENGINEERING_EVIDENCE_DELTA.md'
      - 'BUSINESS_ENGINEERING_OS/CURRENT_BUSINESS_READ_MODEL.json'
      - 'BUSINESS_ENGINEERING_OS/UNLOCK_INTAKE/**'
      - 'BUSINESS_ENGINEERING_OS/2026-08-22_BUSINESS_RESUME_GATE_V1/**'
      - 'BUSINESS_ENGINEERING_OS/2026-08-22_P225_BOUNDED_ACQUISITION_NONFINDING/**'
      - 'BUSINESS_ENGINEERING_OS/2026-08-22_P225_DOCUMENT_COORDINATE_DISCOVERY/**'
      - 'BUSINESS_ENGINEERING_OS/2026-08-22_P288_FRESH_READ_RECONCILIATION/**'
      - '.github/workflows/business-current-read-model.yml'

jobs:
  read-model-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate current Business read model v1.4
        run: |
          python - <<'PY'
          import json, pathlib, importlib.util
          root = pathlib.Path('.')
          model = json.loads((root/'BUSINESS_ENGINEERING_OS/CURRENT_BUSINESS_READ_MODEL.json').read_text())
          core = (root/'BUSINESS_ENGINEERING_OS/CURRENT_BUSINESS_ENGINEERING_AUTHORITY.md').read_text()
          overlay = (root/'BUSINESS_ENGINEERING_OS/CURRENT_BUSINESS_ENGINEERING_EVIDENCE_DELTA.md').read_text()
          p288 = json.loads((root/'BUSINESS_ENGINEERING_OS/2026-08-22_P288_FRESH_READ_RECONCILIATION/01_MACHINE_STATE.json').read_text())
          rc = model['resume_control']
          iv = rc['input_validation']
          coord = rc['latest_target_coordinate_state']
          cal = rc['calibration']
          validator_state = json.loads((root/iv['state_path']).read_text())
          coordinate_state = json.loads((root/coord['machine_state_path']).read_text())
          negative_control = (root/cal['latest_negative_control']).read_text()
          intake = (root/rc['unlock_intake_path']).read_text()
          fixture = json.loads((root/rc['resume_gate_fixture']).read_text())
          runtime_path = root/rc['resume_gate_runtime']
          spec = importlib.util.spec_from_file_location('business_resume_gate', runtime_path)
          gate = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(gate)
          core_lower = core.lower()

          assert model['schema'] == 'ivdivo.business.current_read_model/1.4'
          assert model['restore_order'][2] == 'BUSINESS_ENGINEERING_OS/CURRENT_BUSINESS_READ_MODEL.json::resume_control'
          assert model['current_roots'] == {
            'ROOT_A':'TARGET_PACK_NOT_ACQUIRED',
            'ROOT_B':'NO_EXPLICIT_BIDDER_DESIGNATION_AND_COMPLETE_PACKET'
          }
          ex = model['current_execution']
          assert ex['completed_engineering_subsets'] == ['P257-P264','P265-P272']
          assert ex['completed_total_cards_inside_parent_backlog'] == 17
          assert ex['remaining_unexecuted_count'] == 47
          assert ex['parent_backlog_count'] == 64
          assert ex['highest_information_real_gates'] == [225,235]
          assert ex['completed_total_cards_inside_parent_backlog'] + ex['remaining_unexecuted_count'] == 64
          assert p288['prompt'] == 288 and p288['executed'] is True
          assert p288['parent_backlog']['executed_total'] == 17

          assert iv['status'] == 'CURRENT_BUSINESS_LOCAL_INPUT_ADMISSIBILITY_GATE'
          assert iv['pr'] == 295
          assert iv['merge_sha'] == '301326537269ac97451d70b07a3f6455dc52c175'
          assert iv['deterministic_suite'] == 'PASS_15_OF_15'
          assert iv['real_positive_root_event_count'] == 0
          assert iv['validated_input_is_authority'] is False
          assert validator_state['deterministic_canaries'] == 15
          assert validator_state['parent_execution_count_after'] == 17
          assert validator_state['current_resume_route'] == 'PROTECT_NO_CHANGE'

          assert coord['status'] == 'DOCUMENT_COORDINATE_DISCOVERED_PACK_NOT_YET_ACQUIRED'
          assert coord['documents_coordinate_discovered'] is True
          assert coord['target_pack_acquired'] is False
          assert coord['p225_executed'] is False
          assert coord['classification'] == 'REAL_NEGATIVE_CONTROL_002'
          assert coordinate_state['resource_id'] == '8872468'
          assert coordinate_state['documents_coordinate_discovered'] is True
          assert coordinate_state['attachment_inventory_read_back'] is False
          assert coordinate_state['document_bytes_acquired'] is False
          assert coordinate_state['p225_executed'] is False
          assert coordinate_state['target_pack_acquired'] is False
          assert coordinate_state['resume_route'] == 'PROTECT_NO_CHANGE'

          assert cal['resume_gate_synthetic_deterministic_suite'] == 'PASS_16_OF_16'
          assert cal['input_validator_synthetic_deterministic_suite'] == 'PASS_15_OF_15'
          assert cal['real_negative_control_count'] == 2
          assert cal['real_positive_root_event_count'] == 0
          assert cal['negative_control_classes'] == [
            'BOUNDED_CONNECTED_SOURCE_NONFINDING',
            'FIRST_PARTY_DOCUMENT_COORDINATE_WITHOUT_PACK_BYTES'
          ]
          assert cal['latest_negative_control_result'] == 'PASS_DOCUMENT_COORDINATE_ONLY_ROOT_UNCHANGED_PROTECT_NO_CHANGE'
          assert cal['local_promotion_state'] == 'TWO_NEGATIVE_CONTROLS_PASS_POSITIVE_ROOT_EVENT_PENDING'
          assert cal['broader_or_global_promotion'] is False
          assert 'NEGATIVE_CONTROL_002 = PASS' in negative_control
          assert '`P225_EXECUTED = FALSE`' in negative_control
          assert '`TARGET_PACK_ACQUIRED = FALSE`' in negative_control
          assert '`RESUME_ROUTE = PROTECT_NO_CHANGE`' in negative_control

          keys = [
            'target_pack_acquired','target_requirement_registry_ready','actual_bidder_designation',
            'authoritative_bidder_packet_ready','frozen_target_manifest','frozen_bidder_manifest',
            'bounded_decision_packet_ready','independent_reviewer_ready',
            'external_interaction_authorized','real_decision_use_ready'
          ]
          state = gate.BusinessResumeState(**{k: fixture[k] for k in keys})
          routed = gate.route_business_resume(state)
          assert routed['route'] == 'PROTECT_NO_CHANGE'
          assert routed['external_action_authorized'] is False
          assert routed['proof_promotion'] is False

          assert rc['current_route'] == 'PROTECT_NO_CHANGE'
          assert rc['route_may_authorize_external_action'] is False
          assert rc['route_may_promote_proof_grade'] is False
          assert model['proof_frontier'] == {'public_derived_ceiling':'E2_PLUS','artifact_plane':'PA3','PA4':False,'PA5':False,'E3':False,'E4':False}
          assert 'DOCUMENT_COORDINATE_DISCOVERED_DOES_NOT_EQUAL_TARGET_PACK_ACQUIRED' in model['guards']
          assert 'CORE_CURRENT + MANDATORY_EVIDENCE_OVERLAY = CURRENT_BUSINESS_READ_MODEL' in core
          assert 'total executed = **17**' in core_lower
          assert 'remaining unexecuted = **47**' in core_lower
          assert 'NOT_FOUND_IN_CONNECTED_SOURCES != DOCUMENT_DOES_NOT_EXIST' in overlay
          assert 'AWAITING_AUTHORIZED_INPUT' in intake
          print('CURRENT_BUSINESS_READ_MODEL 1.4: PASS — 2 real negative controls, 0 positive root events, 17/64 unchanged')
          PY
