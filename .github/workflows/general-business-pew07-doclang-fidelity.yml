name: General Business P-EW07 DocLang Fidelity

on:
  pull_request:
    paths:
      - 'BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/31_DOCLANG_PEW07_FIDELITY_PROOF/**'
      - '.github/workflows/general-business-pew07-doclang-fidelity.yml'

jobs:
  fidelity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned official DocLang reference toolkit
        run: python -m pip install 'doclang==0.7.0'
      - name: Official DocLang XSD structural validation — control
        run: doclang validate BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/31_DOCLANG_PEW07_FIDELITY_PROOF/fixtures/good.dclg.xml --xsd-only --quiet
      - name: Official DocLang XSD structural validation — semantic drift
        run: doclang validate BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/31_DOCLANG_PEW07_FIDELITY_PROOF/fixtures/semantic_drift.dclg.xml --xsd-only --quiet
      - name: Run independent fidelity tests
        run: python BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/31_DOCLANG_PEW07_FIDELITY_PROOF/tests/test_fidelity.py
      - name: Verify orthogonality result
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          root = Path('BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/31_DOCLANG_PEW07_FIDELITY_PROOF')
          spec = importlib.util.spec_from_file_location('fidelity', root/'fidelity.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          good = mod.evaluate(root/'fixtures/good.dclg.xml')
          drift = mod.evaluate(root/'fixtures/semantic_drift.dclg.xml')
          assert good['fidelity_pass'] is True
          assert good['mismatch_count'] == 0
          assert drift['fidelity_pass'] is False
          assert drift['mismatch_count'] == 1
          assert drift['mismatches'][0]['expected'] == 'Peter Thomas & Christian Johnston'
          assert drift['mismatches'][0]['actual'] == 'Peter Thomas and Christian Johnston'
          assert drift['wip_promotion'] is False
          assert drift['wtp'] == 'UNKNOWN'
          print('P-EW07 PASS CANDIDATE: both fixtures passed official XSD gates; independent fidelity detects semantic drift')
          PY
