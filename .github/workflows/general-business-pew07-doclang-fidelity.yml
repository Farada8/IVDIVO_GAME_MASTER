name: General Business P-EW07 DocLang Fidelity

on:
  pull_request:
    paths:
      - 'BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/31_DOCLANG_PEW07_FIDELITY_PROOF/**'
      - '.github/workflows/general-business-pew07-doclang-fidelity.yml'

jobs:
  fidelity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned DocLang validator and current Docling runtime
        run: python -m pip install 'doclang==0.7.0' 'docling==2.121.0'

      - name: Orthogonality control — official XSD validation
        run: |
          doclang validate BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/31_DOCLANG_PEW07_FIDELITY_PROOF/fixtures/good.dclg.xml --xsd-only --quiet
          doclang validate BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/31_DOCLANG_PEW07_FIDELITY_PROOF/fixtures/semantic_drift.dclg.xml --xsd-only --quiet

      - name: Orthogonality control — independent fidelity tests
        run: python BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/31_DOCLANG_PEW07_FIDELITY_PROOF/tests/test_fidelity.py

      - name: Actual converter-generated round-trip
        run: |
          python BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/31_DOCLANG_PEW07_FIDELITY_PROOF/roundtrip.py \
            --source BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/31_DOCLANG_PEW07_FIDELITY_PROOF/fixtures/roundtrip_stress.html \
            --out BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/31_DOCLANG_PEW07_FIDELITY_PROOF/runtime

      - name: Official XSD validation — generated DocLang
        run: doclang validate BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/31_DOCLANG_PEW07_FIDELITY_PROOF/runtime/generated_roundtrip.dclg.xml --xsd-only --quiet

      - name: Enforce data-dependent proof boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/31_DOCLANG_PEW07_FIDELITY_PROOF/runtime/roundtrip_result.json')
          r = json.loads(p.read_text(encoding='utf-8'))
          allowed = {
              'PASS_REAL_FIDELITY_GAP_TECHNICAL_ONLY',
              'HOLD_NO_REAL_GAP_IN_BOUNDED_FIXTURES',
          }
          assert r['technical_route'] in allowed
          assert r['wip_promotion'] is False
          assert r['wtp'] == 'UNKNOWN'
          assert r['transactions'] == 0
          assert r['external_action_authorized'] is False
          if r['technical_route'] == 'PASS_REAL_FIDELITY_GAP_TECHNICAL_ONLY':
              assert r['real_converter_generated_gap'] is True
              assert r['mismatch_count'] >= 1
          else:
              assert r['real_converter_generated_gap'] is False
              assert r['mismatch_count'] == 0
          print(json.dumps(r, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload round-trip evidence
        uses: actions/upload-artifact@v4
        with:
          name: pew07-doclang-roundtrip-evidence
          path: BUSINESS_ENGINEERING_OS/GENERAL_BUSINESS_DISCOVERY_PRODUCTION_ENGINE_V1/31_DOCLANG_PEW07_FIDELITY_PROOF/runtime/
