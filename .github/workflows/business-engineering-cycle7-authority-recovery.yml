name: Business Engineering OS Cycle7 Authority Recovery

on:
  pull_request:
    paths:
      - 'BUSINESS_ENGINEERING_OS/2026-08-22_CYCLE7_P97_P128_AUTHORITY_RECOVERY/**'
      - '.github/workflows/business-engineering-cycle7-authority-recovery.yml'
  push:
    branches:
      - 'business-engineering/cycle7-p97-p128-authority-recovery-20260822'
    paths:
      - 'BUSINESS_ENGINEERING_OS/2026-08-22_CYCLE7_P97_P128_AUTHORITY_RECOVERY/**'
      - '.github/workflows/business-engineering-cycle7-authority-recovery.yml'

jobs:
  cycle7-authority-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact 32 Cycle7 canaries
        run: python BUSINESS_ENGINEERING_OS/2026-08-22_CYCLE7_P97_P128_AUTHORITY_RECOVERY/tests/test_authority_recovery.py
      - name: Compile runtime
        run: python -m compileall BUSINESS_ENGINEERING_OS/2026-08-22_CYCLE7_P97_P128_AUTHORITY_RECOVERY/engine
