name: ROOM917 RU S0 Canary

on:
  workflow_dispatch:
    inputs:
      confirm_spend:
        description: 'Type YES to authorize bounded ElevenLabs canary synthesis'
        required: true
        default: 'NO'
        type: string
      max_blocks:
        description: 'Maximum canary blocks to render'
        required: true
        default: '6'
        type: choice
        options:
          - '4'
          - '6'

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard explicit bounded spend request
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_spend }}" != "YES" ]; then
            echo "::error::Paid canary blocked. Re-run with confirm_spend=YES."
            exit 2
          fi
          case "${{ inputs.max_blocks }}" in
            4|6) ;;
            *) echo "::error::max_blocks must be 4 or 6"; exit 3 ;;
          esac

      - name: Fail closed if ElevenLabs secret missing
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ELEVENLABS_API_KEY:-}" ]; then
            echo "::error::Repository secret ELEVENLABS_API_KEY is not configured."
            exit 4
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate sealed S0 authorization against requested spend
        env:
          REQUESTED_MAX_BLOCKS: ${{ inputs.max_blocks }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          p=Path('AUDIO_PRODUCTION/ROOM917/RU_PILOT/ROOM917_RU_S0_NATIVE_BINDINGS.json')
          if not p.exists():
              raise SystemExit('Paid S0 blocked: sealed native bindings/authorization artifact is missing')
          row=json.loads(p.read_text(encoding='utf-8'))
          if row.get('status') != 'PAID_S0_AUTHORIZED':
              raise SystemExit('Paid S0 blocked: bindings status must be PAID_S0_AUTHORIZED')
          if row.get('founder_paid_canary_authorized') is not True or row.get('paid_s0_authorized') is not True:
              raise SystemExit('Paid S0 blocked: explicit authorization flags are not true')
          if row.get('pre_canary_binding_gate') != 'PASS':
              raise SystemExit('Paid S0 blocked: pre_canary_binding_gate must PASS')
          if row.get('canary_binding_only') is not True:
              raise SystemExit('Paid S0 blocked: bindings must be canary-only')
          if row.get('acting_evidence_complete') is not False:
              raise SystemExit('Paid S0 blocked: pre-canary artifact cannot claim acting evidence complete')
          if row.get('cast_lock') is not False or row.get('full_episode_render_allowed') is not False:
              raise SystemExit('Paid S0 blocked: authorization cannot grant CAST LOCK or full E01')
          auth=row.get('authorization') or {}
          if auth.get('scope') != 'ROOM917_RU_S0_CANARY_ONLY':
              raise SystemExit('Paid S0 blocked: authorization scope mismatch')
          top=int(row.get('authorized_max_blocks') or 0)
          nested=int(auth.get('max_blocks') or 0)
          if top != nested or top not in (4,6):
              raise SystemExit('Paid S0 blocked: authorization max-block fields are inconsistent')
          requested=int(os.environ['REQUESTED_MAX_BLOCKS'])
          if requested > top:
              raise SystemExit(f'Paid S0 blocked: requested {requested} blocks exceeds authorized ceiling {top}')
          print(f'PASS_S0_SPEND_CEILING requested={requested} authorized={top}')
          PY

      - name: Compile native-RU bound S0 runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          TEMPLATE="AUDIO_PRODUCTION/ROOM917/RU_PILOT/ROOM917_RU_S0_CANARY_BLOCK_BUNDLE_v1.0.json"
          BINDINGS="AUDIO_PRODUCTION/ROOM917/RU_PILOT/ROOM917_RU_S0_NATIVE_BINDINGS.json"
          SNAPSHOT="AUDIO_PRODUCTION/ROOM917/RU_PILOT/provider/RU_NATIVE_VOICE_DISCOVERY.json"
          RUNTIME="$GITHUB_WORKSPACE/_room917_ru_s0_runtime/RUNTIME_NATIVE_S0_BUNDLE.json"
          if [ ! -f "$SNAPSHOT" ]; then
            echo "::error::Paid S0 blocked: $SNAPSHOT does not exist. Run ROOM917 RU Voice Discovery first."
            exit 6
          fi
          mkdir -p "$(dirname "$RUNTIME")"
          python AUDIO_PRODUCTION/ROOM917/RU_PILOT/tools/prepare_ru_s0_native_bundle.py \
            --template-bundle "$TEMPLATE" \
            --bindings "$BINDINGS" \
            --provider-snapshot "$SNAPSHOT" \
            --out "$RUNTIME"

      - name: Render bounded S0 canary with timestamps
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MAX_BLOCKS: ${{ inputs.max_blocks }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/_room917_ru_s0_canary"
          TMP="$GITHUB_WORKSPACE/_room917_ru_s0_blocks"
          RUNTIME="$GITHUB_WORKSPACE/_room917_ru_s0_runtime/RUNTIME_NATIVE_S0_BUNDLE.json"
          mkdir -p "$OUT" "$TMP"

          python - <<'PY'
          import json, os
          from pathlib import Path

          src=Path('_room917_ru_s0_runtime/RUNTIME_NATIVE_S0_BUNDLE.json')
          bundle=json.loads(src.read_text(encoding='utf-8'))
          maximum=int(os.environ['MAX_BLOCKS'])
          blocks=bundle['blocks'][:maximum]
          if len(blocks) != maximum:
              raise SystemExit(f'Bundle contains {len(blocks)} selected blocks, expected {maximum}')
          tmp=Path('_room917_ru_s0_blocks')
          for i,b in enumerate(blocks,1):
              p=tmp/f'{i:02d}__{b["block_id"]}.json'
              p.write_text(json.dumps(b,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          plan={
              'schema_version':'ivdivo.room917_ru_s0_live_plan/2.0',
              'bundle':str(src),
              'model_id':bundle['model_id'],
              'locale':bundle['locale'],
              'runtime_voice_bindings':bundle.get('runtime_voice_bindings'),
              'provider_snapshot':bundle.get('provider_snapshot'),
              'max_blocks':maximum,
              'selected_block_ids':[b['block_id'] for b in blocks],
              'canary_binding_only':True,
              'acting_evidence_complete_before_render':False,
              'full_episode_render_forbidden':True,
              'cast_lock':False,
          }
          Path('_room917_ru_s0_canary/LIVE_CANARY_PLAN.json').write_text(json.dumps(plan,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          while IFS= read -r block; do
            base="$(basename "$block" .json)"
            mkdir -p "$OUT/$base"
            (
              cd audio/studio
              python elevenlabs_adapter.py "$GITHUB_WORKSPACE/$block" --out-dir "$OUT/$base"
            )
          done < <(find _room917_ru_s0_blocks -maxdepth 1 -type f -name '*.json' | sort)

      - name: Build secret-free receipt and hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path

          root=Path('_room917_ru_s0_canary')
          plan=json.loads((root/'LIVE_CANARY_PLAN.json').read_text(encoding='utf-8'))
          audio=[]
          for p in sorted(root.rglob('*__audio.*')):
              data=p.read_bytes()
              audio.append({
                  'path':str(p.relative_to(root)),
                  'bytes':len(data),
                  'sha256':hashlib.sha256(data).hexdigest(),
              })
          receipt={
              'schema_version':'ivdivo.room917_ru_s0_canary_receipt/2.0',
              'generated_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'provider':'ElevenLabs',
              'secret_persisted':False,
              'native_ru_binding_gate_passed':True,
              'requested_and_rendered_block_count':plan['max_blocks'],
              'selected_block_ids':plan['selected_block_ids'],
              'full_episode_rendered':False,
              'cast_locked':False,
              'audio_files':audio,
              'human_listen_required':True,
              'stage_semantics':'S0_SCREENING_ONLY_NOT_CAST_LOCK',
              'promotion_rule':'NO_CAST_LOCK_AND_NO_FULL_E01_UNTIL_S0_SCREENING_PLUS_FINALIST_VERIFICATION_PLUS_FOUNDER_LISTEN_PASS'
          }
          (root/'CANARY_RECEIPT.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          if len(audio) < plan['max_blocks']:
              raise SystemExit(f'Expected at least {plan["max_blocks"]} audio files, got {len(audio)}')
          print(f'audio_files={len(audio)}')
          PY

      - name: Machine-QC artifact and build listening index
        shell: bash
        run: |
          set -euo pipefail
          python AUDIO_PRODUCTION/ROOM917/RU_PILOT/tools/validate_ru_s0_artifact.py _room917_ru_s0_canary

      - name: Upload S0 listening artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROOM917_RU_S0_CANARY
          path: _room917_ru_s0_canary/
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ROOM917 RU S0 Canary
          - paid dispatch requires explicit confirm_spend=YES
          - requested block count cannot exceed the sealed authorization ceiling
          - paid dispatch requires authenticated native-Russian provider snapshot + canary-only bindings
          - historical diagnostic IDs are rejected by the runtime compiler
          - bounded screening canary only; no full episode
          - S0 output is acting evidence, not CAST LOCK
          - machine QC must pass before artifact upload
          - next gate: human S0 screening; then separately authorized finalist verification for second takes + missing pair/identity evidence
          EOF
