name: Business 8872468 Input Validator

on:
  pull_request:
    paths:
      - 'BUSINESS_ENGINEERING_OS/UNLOCK_INTAKE/**'
      - '.github/workflows/business-8872468-input-validator.yml'
  push:
    branches:
      - 'business-engineering/8872468-input-validator-r2-20260822'

permissions:
  contents: read

jobs:
  input-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run 8872468 input-validation canaries
        run: pytest -q BUSINESS_ENGINEERING_OS/UNLOCK_INTAKE/tests/test_unlock_validator.py
      - name: Compile validator
        run: python -m py_compile BUSINESS_ENGINEERING_OS/UNLOCK_INTAKE/engine/unlock_validator.py
